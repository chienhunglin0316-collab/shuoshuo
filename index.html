  // 加分、鼓勵的話
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const p of (G.pops || [])){
    const k = p.t / p.life, sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
    ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    ctx.font = `${Math.round(p.size * sc)}px "Huninn","Fredoka","Noto Sans TC",sans-serif`;
    ctx.lineWidth = Math.max(4, p.size * 0.18); ctx.strokeStyle = '#FFFFFF';
    const y = p.y - k * cell * 0.9;
    ctx.strokeText(p.text, p.x, y); ctx.fillStyle = C(p.color); ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;
  // 升級
  if (G.levelFlash && t - G.levelFlash < 1.6){
    const k = (t - G.levelFlash) / 1.6, sz = Math.round(cell * (0.62 + Math.sin(Math.min(1, k * 4) * Math.PI) * 0.12));
    ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
    ctx.font = `${sz}px "Huninn","Noto Sans TC",sans-serif`;
    const text = `第 ${G.level} 關！變快囉`, tw = ctx.measureText(text).width;
    const lg = ctx.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
    RAINBOW.forEach((n, i) => lg.addColorStop(i / 5, C(n)));
    ctx.lineWidth = sz * 0.2; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(text, W / 2, boardH / 2);
    ctx.fillStyle = lg; ctx.fillText(text, W / 2, boardH / 2);
    ctx.globalAlpha = 1;
  }
}
function drawZhuyin(ctx, zy, x, cy, size){
  let light = false, tone = '', body = zy;
  if (body.startsWith('˙')){ light = true; body = body.slice(1); }
  const tm = body.match(/[ˊˇˋ]$/); if (tm){ tone = tm[0]; body = body.slice(0, -1); }
  const cs = chars(body), lh = size * 1.05;
  const top = cy - (cs.length * lh) / 2 + lh / 2;
  ctx.font = `${Math.round(size)}px "Noto Sans TC",sans-serif`; ctx.fillStyle = cssVar('--ink-soft');
  if (light) ctx.fillText('˙', x, top - lh * 0.8);
  cs.forEach((c, i) => ctx.fillText(c, x, top + i * lh));
  if (tone) ctx.fillText(tone, x + size * 0.75, cy);
}

/* 比對念出來的字 */
function gameHandle(key, text, alts){
  if (!G.running || G.paused) return;
  if (G.mode === 'en') return gameHandleEn(key, text, alts);
  text = text || '';
  let base = G.cons[key] || 0;
  if (base > text.length) base = text.length;
  if (performance.now() < G.muteUntil){ G.cons[key] = text.length; return; }   // 剛剛是 app 自己在念提示，不算
  const s = text.slice(base);
  const hitR = G.hitR[key] || (G.hitR[key] = new Set());
  let shown = '';
  for (let i = 0; i < s.length; i++){
    const c = toTrad(s[i]); if (!isHan(c)) continue;
    const k = readingKeys(c);
    const t = findTarget(c, k);
    if (t){ fire(t); G.cons[key] = base + i + 1; shown = t.ch; k && k.forEach(x => hitR.add(x)); }
  }
  // 辨識的「其他可能」：小朋友一口氣念很多字時，第一名答案常常漏字，用備選答案補打（同一個讀音不重複打）
  if (alts && alts.length){
    let extra = 0;
    for (const a of alts) for (const c0 of a){
      const c = toTrad(c0);
      if (extra >= 3 || !isHan(c)) continue;
      const k = readingKeys(c); if (!k || [...k].some(x => hitR.has(x))) continue;
      const t = findTarget(c, k);
      if (t){ fire(t); extra++; shown = t.ch; k.forEach(x => hitR.add(x)); }
    }
  }
  const heard = $('#gHeard');
  if (heard) heard.innerHTML = shown ? `<span class="g-hit">✔ ${esc(shown)}</span>　${esc(text.slice(-12))}` : esc(text.slice(-14)) || '我在聽…';
}
function findTarget(c, keys){
  const cand = G.blocks.filter(b => !b.dying && (b.ch === c || (keys && [...b.keys].some(k => keys.has(k)))));
  if (!cand.length) return null;
  cand.sort((a, b) => (b.ch === c) - (a.ch === c) || (a.landed - b.landed) || (a.landed ? a.y - b.y : b.y - a.y));
  return cand[0];
}
function fire(b){
  b.dying = true;
  const [x2, y2] = blockCenter(b);
  const x1 = G.W / 2, y1 = G.cell * ROWS + (G.H - G.cell * ROWS) * 0.58;
  G.aim = Math.atan2(y2 - y1, x2 - x1);
  G.lasers.push({x1, y1, x2, y2, t: 0});
  sfx('laser');
  setTimeout(() => {
    if (!G.running) return;
    const i = G.blocks.indexOf(b); if (i < 0) return;
    G.blocks.splice(i, 1);
    if (b.landed){
      const st = G.stacks[b.col], k = st.indexOf(b);
      if (k >= 0){ const above = st.splice(k); above.shift(); above.forEach(a => { a.landed = false; a.drop = true; }); }
    }
    const colors = RAINBOW.map(cssVar);
    for (let n = 0; n < 26; n++) G.parts.push({x: x2, y: y2, vx: (Math.random() - 0.5) * 560, vy: (Math.random() - 0.9) * 500, t: 0, life: 0.7 + Math.random() * 0.5, s: n % 2 ? 6 + Math.random() * 6 : 9 + Math.random() * 8, c: colors[n % colors.length], star: n % 2 === 0});
    G.combo = G.t - G.lastHitT < 3 ? G.combo + 1 : 1; G.lastHitT = G.t;
    const gain = 10 * G.level + (G.combo - 1) * 5;
    G.hit++; G.score += gain;
    const px = Math.min(G.W - G.cell, Math.max(G.cell, x2));
    G.pops.push({text: '+' + gain, x: px, y: y2, t: 0, life: 0.9, size: G.cell * 0.42, color: '--orange'});
    if (G.combo >= 2 || Math.random() < 0.3){
      const words = G.combo >= 3 ? [`連續 ${G.combo} 次！`, '太厲害了！', '停不下來！'] : ['好棒！', '讚！', '答對了！', '好聰明！', '漂亮！'];
      G.pops.push({text: words[Math.floor(Math.random() * words.length)], x: px, y: y2 - G.cell * 0.55, t: 0, life: 1.1, size: G.cell * 0.5, color: ['--pink', '--purple', '--blue', '--green'][Math.floor(Math.random() * 4)]});
    }
    const lv = 1 + Math.max(Math.floor(G.hit / 8), Math.floor(G.t / 45));
    if (lv > G.level){ G.level = lv; G.levelFlash = G.t; sfx('level'); }
    $('#gScore').textContent = G.score; $('#gHit').textContent = G.hit; $('#gLevel').textContent = G.level;
  }, 180);
}
/* 點一下字：念給小朋友聽（念的時候先不聽，免得被自己的聲音打掉） */
function onBoardTap(ev){
  if (!G.running || G.paused) return;
  const r = G.cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) * (G.W / r.width), y = (ev.clientY - r.top) * (G.H / r.height);
  const b = G.blocks.find(b => !b.dying && x >= b.col * G.cell && x < (b.col + 1) * G.cell && y >= b.y && y < b.y + G.cell);
  if (!b) return;
  G.muteUntil = performance.now() + 1800;
  musicDuck(1.8);
  if (b.word) sayOne(b.word, 'en-US', 0.8); else sayOne(b.ch, 'zh-TW', 0.8);
}

/* 遊戲時一直開著麥克風 */
/* 離線辨識引擎（Vosk）：只從這一關會出現的字裡猜，比 Google 辨識快很多；不能用時自動改回 Google */
function voskOk(){ try { return !!(NATIVE && window.Android.voskOk && window.Android.voskOk()); } catch(e){ return false; } }
function voskPrepare(lang){ if (voskOk()) try { window.Android.voskPrepare(lang); } catch(e){} }
// 簡體 → 這一關用的繁體字
function toTrad(c){ return (G.rev && G.rev.get(c)) || c; }
function gameGrammar(){
  if (G.mode === 'en') return [...new Set(G.enPool.map(q => q.w))].concat(['[unk]']);
  const s = new Set(); G.rev = new Map();
  for (const x of POOLS[G.diff]){
    const t = x.c, sc = (TS && TS[t]) || t;
    s.add(sc);
    if (sc !== t && !G.rev.has(sc)) G.rev.set(sc, t);
  }
  return [...s, '[unk]'];
}
/* 網頁版的離線辨識引擎（vosk-browser，在瀏覽器裡執行，不用網路）
   模型第一次玩時下載（中文約 42 MB、英文約 40 MB），之後存在平板裡。 */
const WV = {gen: 0, model: null, key: null, urls: {}, cur: null};
function webVoskOk(){
  return !NATIVE && typeof WebAssembly === 'object' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    && !!(window.AudioContext || window.webkitAudioContext) && (location.protocol === 'https:' || location.hostname === 'localhost');
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function webModelUrl(key, onProgress){
  if (WV.urls[key]) return WV.urls[key];
  // 模型檔放在 models/ 資料夾，或直接放在網站最外層都可以
  let base = 'models/', res0 = await fetch(base + 'models.json').catch(() => null);
  if (!res0 || !res0.ok){ base = ''; res0 = await fetch('models.json'); }
  const info = (await res0.json())[key];
  const parts = []; let got = 0;
  for (let i = 0; i < info.parts; i++){
    const res = await fetch(`${base}${key}.tar.gz.${i}`);
    if (!res.ok) throw new Error('model ' + res.status);
    const rd = res.body.getReader(), chunks = [];
    for (;;){ const {done, value} = await rd.read(); if (done) break; chunks.push(value); got += value.length; onProgress && onProgress(got / info.size); }
    parts.push(new Blob(chunks));
  }
  return WV.urls[key] = URL.createObjectURL(new Blob(parts, {type: 'application/gzip'}));
}
async function webVoskModel(key, onProgress){
  if (WV.model && WV.key === key) return WV.model;
  if (!window.Vosk) await loadScript('lib/vosk.js');
  const url = await webModelUrl(key, onProgress);
  if (WV.model){ try { WV.model.terminate(); } catch(e){} WV.model = null; }
  WV.model = await Vosk.createModel(url, -2); WV.key = key;
  return WV.model;
}
function webVoskStop(){
  WV.gen++;
  const c = WV.cur; WV.cur = null;
  if (!c) return;
  try { c.proc.disconnect(); c.src.disconnect(); } catch(e){}
  try { c.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  try { c.ctx.close(); } catch(e){}
  try { c.rec.remove(); } catch(e){}
}
async function webVoskStart(lang, grammar){
  const gen = ++WV.gen, key = lang === 'en-US' ? 'en' : 'cn';
  const heard = () => $('#gHeard');
  try {
    const firstTime = !(WV.model && WV.key === key);
    if (firstTime && heard()) heard().innerHTML = '遊戲語音準備中…';
    const model = await webVoskModel(key, p => { const h = heard(); if (h && gen === WV.gen) h.innerHTML = `遊戲語音下載中（只有第一次）<span class="g-load"><i style="width:${Math.round(p * 100)}%"></i></span> ${Math.round(p * 100)}%`; });
    if (gen !== WV.gen) return;
    const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, channelCount: 1}});
    if (gen !== WV.gen){ stream.getTracks().forEach(t => t.stop()); return; }
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const rec = new model.KaldiRecognizer(ctx.sampleRate, JSON.stringify(grammar));
    let last = '';
    rec.on('result', m => { if (gen !== WV.gen) return; last = ''; gameNativeSr('final', (m.result && m.result.text) || ''); });
    rec.on('partialresult', m => { if (gen !== WV.gen) return; const p = (m.result && m.result.partial) || ''; if (p && p !== last){ last = p; gameNativeSr('partial', p); } });
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(2048, 1, 1);   // 約 0.04 秒送一次
    let rmsAt = 0;
    proc.onaudioprocess = e => {
      if (gen !== WV.gen) return;
      try { rec.acceptWaveform(e.inputBuffer); } catch(err){}
      const now = performance.now();
      if (now - rmsAt > 120){
        rmsAt = now;
        const d = e.inputBuffer.getChannelData(0); let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] * d[i];
        const db = 10 * Math.log10(s / (d.length / 4) + 1e-10);
        gameNativeSr('rms', String(Math.round((db + 60) / 5)));
      }
    };
    src.connect(proc); proc.connect(ctx.destination);
    WV.cur = {stream, ctx, rec, src, proc};
    gameNativeSr('start', '');
    if (heard()) heard().textContent = G.mode === 'en' ? 'I\'m listening！開始說吧！' : '我在聽，開始念吧！';
  } catch(err){
    if (gen !== WV.gen) return;
    // 不能用（舊瀏覽器、下載失敗、沒給麥克風）：改用瀏覽器內建的語音辨識
    const h = heard();
    if (err && err.name === 'NotAllowedError'){ if (h) h.textContent = '請允許使用麥克風才能玩喔'; return; }
    G.webVoskFailed = true; G.webVosk = false;
    if (G.running && !G.paused) gameListenStart();
  }
}
function gameListenStart(){
  const mic = $('#gMic');
  const lang = G.mode === 'en' ? 'en-US' : 'zh-TW';
  G.rev = null;
  if (!G.voskFailed && voskOk()){
    G.nativeListen = true; G.vosk = true; G.nsess = 0;
    try { window.Android.voskListen(lang, JSON.stringify(gameGrammar())); mic && mic.classList.add('on'); return; }
    catch(e){ G.vosk = false; G.voskFailed = true; }
  }
  if (!G.webVoskFailed && webVoskOk()){
    G.webVosk = true; G.nsess = 0;
    mic && mic.classList.add('on');
    webVoskStart(lang, gameGrammar());
    return;
  }
  if (NATIVE && window.Android.gameListen){ G.nativeListen = true; G.nsess = 0; window.Android.gameListen(G.mode === 'en' ? 'en-US' : 'zh-TW'); mic && mic.classList.add('on'); return; }
  if (!SR){ $('#gHeard').textContent = '這台裝置不能用語音，點字可以聽發音'; return; }
  G.recSession = (G.recSession || 0) + 1;
  const rec = new SR(); G.rec = rec;
  rec.lang = G.mode === 'en' ? 'en-US' : 'zh-TW'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
  rec.onstart = () => mic && mic.classList.add('on');
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++){
    const r = e.results[i], alts = [];
    if (r.isFinal) for (let j = 1; j < r.length; j++) alts.push(r[j].transcript);
    gameHandle('w' + G.recSession + '_' + i, r[0].transcript, alts);
  } };
  rec.onerror = e => { if (e.error === 'not-allowed'){ $('#gHeard').textContent = '請允許使用麥克風才能玩喔'; G.rec = null; } };
  rec.onend = () => { if (G.rec === rec && G.running && !G.paused){ G.recSession++; try { rec.start(); } catch(err){} } else mic && mic.classList.remove('on'); };
  try { rec.start(); } catch(e){}
}
function gameListenStop(){
  const mic = $('#gMic'); if (mic){ mic.classList.remove('on'); mic.style.transform = ''; }
  if (G.vosk){ G.vosk = false; try { window.Android.voskStop(); } catch(e){} }
  if (G.webVosk){ G.webVosk = false; webVoskStop(); }
  if (G.nativeListen){ G.nativeListen = false; try { window.Android.gameStop(); } catch(e){} }
  if (G.rec){ const r = G.rec; G.rec = null; try { r.abort(); } catch(e){} }
}
function gameNativeSr(type, text){
  if (type === 'vosk'){
    const h = $('#gHeard');
    if (text === 'loading' && h) h.textContent = '語音準備中，請稍等一下…';
    else if (text === 'ready' && h) h.textContent = G.mode === 'en' ? 'I\'m listening！開始說吧！' : '我在聽，開始念吧！';
    else if (text === 'fail' && G.vosk){
      // 離線引擎不能用：改回 Google 語音辨識
      G.vosk = false; G.voskFailed = true;
      if (G.running && !G.paused){ G.nsess = 0; window.Android.gameListen(G.mode === 'en' ? 'en-US' : 'zh-TW'); }
    }
    return;
  }
  if (type === 'start'){ G.nsess++; }
  else if (type === 'error'){ const h = $('#gHeard'); if (h && (text === 'not-allowed' || text === 'unavailable')) h.textContent = text === 'not-allowed' ? '請允許使用麥克風才能玩喔' : '這台平板不能用語音，點字可以聽發音'; }
  else if (type === 'partial') gameHandle('n' + G.nsess, text);

/* 遊戲音效（用程式合成，不需要音檔） */
let AC = null;
function sfx(type){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    if (type === 'laser'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.25); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26); o.start(t); o.stop(t + 0.27); }
    else if (type === 'land'){ o.type = 'triangle'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.15); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.start(t); o.stop(t + 0.2); }
    else if (type === 'ding'){ o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.06); g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22); o.start(t); o.stop(t + 0.23); }
    else if (type === 'buzz'){ o.type = 'square'; o.frequency.setValueAtTime(160, t); o.frequency.linearRampToValueAtTime(110, t + 0.2); g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24); o.start(t); o.stop(t + 0.25); }
    else if (type === 'win'){ o.type = 'triangle'; [523, 659, 784, 1047, 1319].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.08)); g.gain.setValueAtTime(0.14, t); g.gain.setValueAtTime(0.14, t + 0.36); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7); o.start(t); o.stop(t + 0.72); }
    else if (type === 'level'){ o.type = 'square'; [523, 659, 784, 1047].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.09)); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45); o.start(t); o.stop(t + 0.46); }
  } catch(e){}

/* 緊張的背景音樂（程式即時合成，不需要音檔）
   小調低音快速重複＋鼓聲＋半音「滴答」聲；關卡越高拍子越快，快堆到頂時加上警報聲。
   主要用低音，比較不會干擾麥克風聽小朋友念字。 */
const MUSIC = {on: (() => { try { return localStorage.getItem('ssd-music') !== '0'; } catch(e){ return true; } })(), timer:0, next:0, step:0, bus:null, noise:null};
const MUSIC_VOL = 0.55;
function audioUnlock(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){}
}
function setMusicOn(on){
  MUSIC.on = on;
  try { localStorage.setItem('ssd-music', on ? '1' : '0'); } catch(e){}
  if (!on) musicStop();
}
function musicStart(){
  if (!MUSIC.on || MUSIC.timer) return;
  audioUnlock(); if (!AC) return;
  if (!MUSIC.noise){
    const len = AC.sampleRate * 0.5, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    MUSIC.noise = buf;
  }
  const bus = AC.createGain(); bus.gain.setValueAtTime(0.0001, AC.currentTime);
  bus.gain.exponentialRampToValueAtTime(MUSIC_VOL, AC.currentTime + 0.6);
  bus.connect(AC.destination); MUSIC.bus = bus;
  MUSIC.next = AC.currentTime + 0.08; MUSIC.step = 0;
  MUSIC.timer = setInterval(musicTick, 25);
}
function musicStop(){
  if (!MUSIC.timer) return;
  clearInterval(MUSIC.timer); MUSIC.timer = 0;
  const bus = MUSIC.bus; MUSIC.bus = null;
  if (bus && AC){ const t = AC.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value, t); bus.gain.linearRampToValueAtTime(0, t + 0.25); setTimeout(() => { try { bus.disconnect(); } catch(e){} }, 400); }
}
/* app 念字時把音樂調小聲 */
function musicDuck(sec){
  const bus = MUSIC.bus; if (!bus || !AC) return;
  const t = AC.currentTime;
  bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value, t);
  bus.gain.linearRampToValueAtTime(MUSIC_VOL * 0.25, t + 0.1);
  bus.gain.setValueAtTime(MUSIC_VOL * 0.25, t + sec);
  bus.gain.linearRampToValueAtTime(MUSIC_VOL, t + sec + 0.4);
}
function musicDanger(){ return G.stacks ? Math.max(...G.stacks.map(s => s.length)) >= ROWS - 3 : false; }
function musicTick(){
  if (!AC || !MUSIC.bus) return;
  const danger = musicDanger();
  const bpm = Math.min(180, 116 + (G.level - 1) * 8 + (danger ? 10 : 0));
  const s16 = 60 / bpm / 4;
  if (MUSIC.next < AC.currentTime - 0.2) MUSIC.next = AC.currentTime + 0.02;   // 分頁被暫停過，重新對時
  while (MUSIC.next < AC.currentTime + 0.12){ musicStep(MUSIC.step, MUSIC.next, s16, danger); MUSIC.next += s16; MUSIC.step++; }
}
function mNote(type, f, t, dur, vol, filt){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  if (filt){ const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filt; o.connect(lp); lp.connect(g); } else o.connect(g);
  g.connect(MUSIC.bus); o.start(t); o.stop(t + dur + 0.02);
  return o;
}
function mNoise(t, dur, vol, type, freq){
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = MUSIC.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(MUSIC.bus); s.start(t); s.stop(t + dur + 0.02);
}
// 四小節一循環：A 小調 → A → F → E（E 大和弦帶出緊張感）
const M_ROOT = [55, 55, 43.65, 41.2];
const M_BASS = [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 0, 12];
const M_TICK = [[659.3, 698.5], [659.3, 698.5], [698.5, 740], [622.3, 659.3]];
function musicStep(step, t, s16, danger){
  const bar = Math.floor(step / 16) % 4, i = step % 16;
  // 低音（鋸齒波＋低通，像心跳一樣一直跑）
  mNote('sawtooth', M_ROOT[bar] * 2 * Math.pow(2, M_BASS[i] / 12), t, s16 * 0.9, 0.16, 520 + (G.level - 1) * 40);
  // 大鼓
  if (i % 4 === 0){ const o = mNote('sine', 130, t, 0.22, 0.5); o.frequency.exponentialRampToValueAtTime(42, t + 0.18); }
  // 小鼓
  if (i === 4 || i === 12) mNoise(t, 0.12, 0.12, 'bandpass', 1800);
  // 細碎的鈸（很小聲）
  if (i % 2 === 1) mNoise(t, 0.03, 0.025, 'highpass', 8000);
  // 半音「滴答」：讓人覺得時間在追
  if (i % 4 === 0){ const p = M_TICK[bar][(i / 4) % 2]; mNote('triangle', p, t, 0.09, 0.06); }
  // 快堆到頂：警報聲
  if (danger && i % 8 === 0) { const o = mNote('square', 880, t, s16 * 3.5, 0.045, 3000); o.frequency.linearRampToValueAtTime(660, t + s16 * 3.5); }
}

// 年級 → 用哪幾級的字（以該年級為主，混一些前一級）
function enPool(grade){
  const main = EN_BANK[grade - 1], prev = grade > 1 ? EN_BANK[grade - 2] : [];
  return main.concat(prev.filter((_, i) => i % 2 === 0));
}
// 語音辨識常把英文字聽成同音字或數字
const EN_SAME = {to:'two', too:'two', for:'four', ate:'eight', won:'one', be:'bee', b:'bee', i:'eye', aye:'eye', pair:'pear', pare:'pear', son:'sun', aunt:'ant', pi:'pie', read:'red', dear:'deer', bare:'bear', night:'knight', see:'sea', hair:'hare',
  '1':'one', '2':'two', '3':'three', '4':'four', '5':'five', '6':'six', '7':'seven', '8':'eight', '9':'nine', '10':'ten', kat:'cat', cap:'cup', doughnut:'donut', noodle:'noodles', sock:'socks', glove:'gloves', ruler:'ruler'};
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 9;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function enWordMatch(said, target){
  if (!said) return false;
  said = EN_SAME[said] || said;
  if (said === target) return true;
  for (const v of [said.replace(/s$/, ''), said.replace(/es$/, ''), said.replace(/ies$/, 'y')])
    if (v === target || v === target.replace(/s$/, '')) return true;
  return target.length >= 5 && lev(said, target) <= 1;
}
function enWords(text){ return (text || '').toLowerCase().replace(/\[unk\]/g, ' ').replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean); }

/* 英文圖片雷射：比對念出來的英文 */
function gameHandleEn(key, text, alts){
  const ws = enWords(text);
  let base = G.cons[key] || 0; if (base > ws.length) base = ws.length;
  if (performance.now() < G.muteUntil){ G.cons[key] = ws.length; return; }
  const hitR = G.hitR[key] || (G.hitR[key] = new Set());
  let shown = '';
  const tryWord = w => {
    const t = G.blocks.filter(b => !b.dying && !hitR.has(b.word) && enWordMatch(w, b.word))
      .sort((a, b) => (a.landed - b.landed) || (a.landed ? a.y - b.y : b.y - a.y))[0];
    if (t){ fire(t); hitR.add(t.word); shown = t.word; return true; }
    return false;
  };
  for (let i = base; i < ws.length; i++) if (tryWord(ws[i])) G.cons[key] = i + 1;
  if (alts) for (const a of alts) for (const w of enWords(a)) tryWord(w);
  const heard = $('#gHeard');
  if (heard) heard.innerHTML = shown ? `<span class="g-hit">✔ ${esc(shown)}</span>　${esc((text || '').slice(-24))}` : esc((text || '').slice(-28)) || 'I\'m listening…';
}

}
let SINGLES = null;
const contCache = new Map();
// 「後面好接」：用這個字（字母）開頭的常用詞有幾個（只算同一個字，不算同音字）
function canContinue(mode, unit){
  const key = mode + unit;
  if (!contCache.has(key)){
    const n = mode === 'en' ? [...enChainMap().keys()].filter(w => w[0] === unit).length
      : mode === 'idiom' ? idiomStarts(unit).length
      : zhStarts(unit).filter(w => chars(w).every(isCommonChar)).length;
    contCache.set(key, n);
  }
  return contCache.get(key);
}
// 國小常見字：教育部簡編本裡最常出現的 1200 個字
let COMMON = null;
function isCommonChar(c){
  if (!COMMON){ COMMON = new Set([...CHARFREQ.entries()].sort((a, b) => b[1] - a[1]).slice(0, 1200).map(x => x[0])); }
  return COMMON.has(c);
}
// 電腦要說的詞：越常用、字越簡單越好
function kidRank(mode, w){
  if (mode === 'en') return (EN_BANK.findIndex(lv => lv.some(q => q.w === w)) + 1 || 4) * -1 + Math.random() * 2;
  const common = chars(w).filter(isCommonChar).length / chars(w).length;
  if (mode === 'idiom') return (KID_STORIES[w] ? 3 : 0) + common * 2 + (DICT[w] ? Math.log1p(wordScore(w)) * 0.3 : 0) + Math.random();
  return common * 4 + Math.log1p(wordScore(w)) + Math.random() * 0.8;
}
const chUnit = w => CH.mode === 'en' ? w[w.length - 1] : lastChar(w);
function chStartOK(w){
  if (!CH.target) return true;
  return CH.mode === 'en' ? w[0] === CH.target : sameSound(chars(w)[0], CH.target);
}
// 從小朋友說的話找出要接的詞
function chParse(text){
  if (CH.mode === 'en'){
    const ws = enWords(text).filter(w => /^[a-z]{2,}$/.test(w) && !['i','a'].includes(w));
    const w = (CH.target && ws.find(x => x[0] === CH.target)) || ws[0];
    return w ? {w} : {bad: 'short'};
  }
  const s = stripAsk(text).replace(/[^\p{Script=Han}]/gu, '');
  const cs = chars(s);
  const isOk = w => CH.mode === 'idiom' ? !!IDIOMS[w] : !!(DICT[w] || IDIOMS[w]);
  const tryAt = i => {
    const max = CH.mode === 'idiom' ? 12 : 4, min = CH.mode === 'idiom' ? 3 : 2;
    for (let n = Math.min(max, cs.length - i); n >= min; n--){ const w = cs.slice(i, i + n).join(''); if (isOk(w)) return w; }
    return null;
  };
  if (CH.target) for (let i = 0; i < cs.length - 1; i++) if (sameSound(cs[i], CH.target)){ const w = tryAt(i); if (w) return {w}; }
  for (let i = 0; i < cs.length - 1; i++){ const w = tryAt(i); if (w) return {w}; }
  if (cs.length < (CH.mode === 'idiom' ? 3 : 2)) return {bad: 'short', s};
  return {bad: CH.mode === 'idiom' ? 'notIdiom' : 'notWord', s};
}
function chZy(w){
  if (CH.mode === 'en') return '';
  if (DICT[w]) return (entry(w)[0].zy || '').replace(/（.*$/, '');
  if (IDIOMS[w]) return IDIOMS[w][0] || '';
  return '';
}

function chainUpdateHud(){
  $('#chCount') && ($('#chCount').textContent = CH.count);

function chainSubmit(text){
  if (!CH.on || CH.busy) return;
  const heard = $('#chHeard'); if (heard) heard.textContent = '「' + text + '」';
  const r = chParse(text);
  const u = CH_INFO[CH.mode].unit;
  if (r.bad){
    const say = {short: CH.mode === 'en' ? '沒聽清楚，再說一個英文單字好嗎？' : CH.mode === 'idiom' ? (r.s && chars(r.s).length === 2 ? `「${r.s}」不是成語喔，成語通常是四個字，再想想看！` : '成語通常是四個字，再說一次好嗎？') : `要說兩個字以上的${u}喔，再試一次！`,
      notWord: `字典裡找不到「${r.s}」，換一個詞試試看！`, notIdiom: `「${r.s}」好像不是成語喔，再想想看！`}[r.bad];
    chMsg(say, 'warn'); sfx('buzz'); speak(say.replace(/[「」]/g, '')); return;
  }
  const w = r.w;
  if (!chStartOK(w)){
    const t = CH.mode === 'en' ? CH.target.toUpperCase() : CH.target;
    const say = CH.mode === 'en' ? `${w} 不是用 ${t} 開頭喔，再想一個！` : `「${w}」不是用「${t}」開頭喔，再想一個！`;
    chMsg(say, 'warn'); sfx('buzz'); speak(say.replace(/[「」]/g, '')); return;
  }
  if (CH.used.has(w)){ const say = `「${w}」已經接過了，換一個吧！`; chMsg(say, 'warn'); sfx('buzz'); speak(say.replace(/[「」]/g, '')); return; }
  CH.used.add(w);
  chainCard(w, 'kid');
  CH.count++; CH.score += CH.helped ? 5 : 10; CH.helped = false;
  chainUpdateHud(); sfx('ding');
  chMsg(['接得好！', '太棒了！', '好厲害！', '答對了！'][Math.floor(Math.random() * 4)], 'ok');
  CH.busy = true;
  setTimeout(() => chainComputer(chUnit(w)), 800);
}
// 電腦接：unit 是要接的字／字母；null 表示電腦先開始
function chainComputer(unit){
  if (!CH.on) return;
  CH.busy = true;
  let pool;
  if (unit === null){
    // 電腦先說：挑一個好接的常用詞
    pool = CH.mode === 'en' ? [...enChainMap().keys()].filter(w => EN_BANK[0].concat(EN_BANK[1]).some(q => q.w === w))
      : CH.mode === 'idiom' ? Object.keys(KID_STORIES).filter(w => IDIOMS[w])
      : ['蘋果', '太陽', '學校', '朋友', '老師', '小狗', '天空', '花園', '電話', '書包', '火車', '月亮'];
    pool = pool.filter(w => !CH.used.has(w));
  } else {
    pool = startsList(CH.mode, unit).filter(w => !CH.used.has(w));
  }
  // 優先挑「小朋友聽得懂、又接得下去」的：常用字組成，而且最後一個字（字母）後面還有很多可以接
  const need = CH.mode === 'idiom' ? 2 : CH.mode === 'en' ? 4 : 6;
  const cand = pool.slice(0, 80);
  const easy = cand.filter(w => canContinue(CH.mode, chUnit(w)) >= need);
  const ranked = (easy.length ? easy : cand).map(w => [w, kidRank(CH.mode, w)]).sort((a, b) => b[1] - a[1]);
  const pickFrom = ranked.slice(0, 4).map(x => x[0]);
  const rep = pickFrom[Math.floor(Math.random() * pickFrom.length)];
  if (!rep){
    // 電腦接不下去：小朋友贏了
    CH.score += 50; chainUpdateHud(); sfx('win');
    const say = '電腦接不下去了，你贏了！加 50 分！';
    chMsg('🎉 ' + say, 'ok');
    speak(say + '我們重新開始，電腦先說。', {onEnd: () => { if (CH.on){ CH.target = null; chainComputer(null); } }});
    return;
  }
  CH.used.add(rep);
  chainCard(rep, 'pc');
  CH.target = chUnit(rep);
  chainPrompt();
  CH.busy = false;
  const heard = $('#chHeard'); if (heard) heard.textContent = '';
  if (CH.mode === 'en'){
    const m = enChainMap().get(rep) || {};
    chMsg(`電腦說：<b class="en">${esc(rep)}</b>${m.zh ? `（${esc(m.zh)}）` : ''}，換你了！`);
    speak(rep, {lang: 'en-US', onEnd: () => CH.on && speak(`請用字母 ${CH.target.toUpperCase()} 開頭。`)});
  } else {
    const homo = unit && chars(rep)[0] !== unit ? `（用同音字「${chars(rep)[0]}」接「${unit}」）` : '';
    chMsg(`電腦說：<b>${esc(rep)}</b>${esc(homo)}，換你了！`);
    speak(`${rep}。請用${CH.target}開頭的${CH_INFO[CH.mode].unit}。`);
  }
}
function chainHelp(){
  if (!CH.on || CH.busy || CH.helps <= 0) return;
  const pool = (CH.target ? startsList(CH.mode, CH.target) : (CH.mode === 'en' ? ['apple', 'dog', 'sun'] : CH.mode === 'idiom' ? ['一心一意', '守株待兔', '畫蛇添足'] : ['蘋果', '學校', '朋友'])).filter(w => !CH.used.has(w));
  if (!pool.length){ chMsg('連求救也找不到可以接的了，你可以按「我接不下去了」。', 'warn'); return; }
  CH.helps--; CH.helped = true; chainUpdateHud();
  const picks = pool.slice(0, 80).map(w => [w, kidRank(CH.mode, w)]).sort((a, b) => b[1] - a[1]).slice(0, CH.mode === 'idiom' ? 2 : 3).map(x => x[0]);
  let html;
  if (CH.mode === 'idiom'){
    const brief = w => ((IDIOMS[w][1] || '').replace(/[※◎].*$/s, '').split(/[。\n]/)[0] || '').slice(0, 30);

  } else if (CH.mode === 'en'){
    html = '🆘 可以試試看：' + picks.map(w => { const m = enChainMap().get(w) || {}; return `<span class="ch-sug"><b class="en">${m.e || ''} ${esc(w)}</b><small>${esc(m.zh || '')}</small></span>`; }).join('');
  } else {
    html = '🆘 可以試試看：' + picks.map(w => `<span class="ch-sug"><b>${esc(w)}</b><small>${esc(chZy(w))}</small></span>`).join('');
  }
  chMsg(html + `<span class="ch-left">（還剩 ${CH.helps} 次求救）</span>`, 'help');
  if (CH.mode === 'en') speak(picks[0], {lang: 'en-US'}); else speak('可以說：' + picks[0]);
}
function chainEnd(gaveUp){
  if (!CH.on) return;
  const mode = CH.mode, info = CH_INFO[mode];

    ${words.length ? `<p style="margin:12px 0 4px">這次接龍的${info.unit}（點一下可以查字典）：</p><div class="words" style="justify-content:center">${words.map(w => `<button class="${mode === 'en' ? 'en' : ''}" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div>` : ''}

}
// 遊戲裡的大麥克風：跟底部的麥克風一樣，按住說、放開就停
function bindHoldMic(btn){
  let hold = false, t0 = 0;
  btn.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    try { btn.setPointerCapture(ev.pointerId); } catch(e){}
    if (CH.busy) return;
    if (listening){ stopListen(); return; }
    hold = true; t0 = Date.now();
    startListen();
  });
  const up = () => { if (!hold) return; hold = false; if (Date.now() - t0 > 700) stopListen(); };
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('contextmenu', ev => ev.preventDefault());
  btn.addEventListener('click', ev => { if (ev.detail === 0) listening ? stopListen() : startListen(); });
}

let PLAN = null;
function planSave(){ try { localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); } catch(e){} }
const pid = () => Math.random().toString(36).slice(2, 8);
// 日期（用平板當地時間）
const dISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dParse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dAdd = (s, n) => { const d = dParse(s); d.setDate(d.getDate() + n); return dISO(d); };
const dDiff = (a, b) => Math.round((dParse(b) - dParse(a)) / 86400000);
const todayISO = () => dISO(new Date());
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const dLabel = s => { const d = dParse(s); return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`; };
const isWeekend = s => [0, 6].includes(dParse(s).getDay());

// 所有要做的項目（還沒考的科目）
function planItems(){
  const t0 = todayISO(), out = [];
  const types = PLAN.types.filter(t => t.on);
  for (const ex of PLAN.exams) for (const s of ex.subjects){
    if (!s.date || s.date < t0) continue;
    const from = Math.min(s.from, s.to), to = Math.max(s.from, s.to);
    const base = {exam: ex, subj: s};
    for (let n = from; n <= to; n++) for (const t of types)
      out.push({...base, key: `${ex.id}|${s.id}|L${n}|${t.id}`, lesson: n, type: t, review: 0});
    for (let k = 1; k <= PLAN.reviewDays; k++)
      out.push({...base, key: `${ex.id}|${s.id}|R${k}`, lesson: 0, type: {id: 'review', name: '總複習', icon: '⭐'}, review: k});
  }
  return out;
}
function planVersion(){ return JSON.stringify([PLAN.exams, PLAN.types, PLAN.perDay, PLAN.weekendMore, PLAN.reviewDays]); }
const dayCap = s => PLAN.perDay + (PLAN.weekendMore && isWeekend(s) ? 2 : 0);

/* 排計畫：從 startDay 開始，把還沒完成的項目排進每一天
   - 每科的課文項目要在「考試日 - 總複習天數」之前做完
   - 總複習固定排在考試前幾天
   - 每天先排最趕的科目（剩下的項目 ÷ 剩下的天數 最大的） */
// 份量不夠讀完時，每天平均多排一點（找出「每天最少要多幾項」才讀得完），不要全部擠到考前
function planSchedule(items, startDay){
  let r = null;
  for (let extra = 0; extra <= 40; extra++){
    r = planScheduleRaw(items, startDay, extra);
    if (!r.late){ r.extra = extra; r.tight = extra > 0; return r; }
  }
  r.extra = 40; r.tight = true;
  return r;
}
function planScheduleRaw(items, startDay, extra){
  const days = new Map();
  const add = (d, it) => { if (!days.has(d)) days.set(d, []); days.get(d).push(it); };
  let tight = false, late = 0;
  const bySubj = new Map();
  for (const it of items){
    const sk = it.exam.id + '|' + it.subj.id;
    if (!bySubj.has(sk)) bySubj.set(sk, {subj: it.subj, lessons: [], reviews: []});
    (it.review ? bySubj.get(sk).reviews : bySubj.get(sk).lessons).push(it);
  }
  let last = startDay;
  for (const g of bySubj.values()){
    g.deadline = dAdd(g.subj.date, -1 - PLAN.reviewDays);      // 課文項目最晚這天做完
    for (const r of g.reviews){
      let d = dAdd(g.subj.date, -r.review);
      if (d < startDay) d = startDay;
      add(d, r);
    }
    if (g.subj.date > last) last = g.subj.date;
  }
  for (let d = startDay; d < last; d = dAdd(d, 1)){
    let cap = dayCap(d) + extra - (days.get(d) || []).filter(x => x.review).length;
    // 已經過了期限還沒排完的科目：今天一定要排（時間很趕）
    for (const g of bySubj.values()) if (g.lessons.length && d > g.deadline && d < g.subj.date){
      tight = true;
      while (g.lessons.length && cap > 0){ add(d, g.lessons.shift()); cap--; late++; }
    }
    const taken = new Map();
    while (cap > 0){
      // 最趕的科目先排；同一天已經排過的科目稍微讓一下，讓每天有 2～3 科輪流
      let best = null, bestU = -1;
      for (const g of bySubj.values()){
        if (!g.lessons.length || d >= g.subj.date) continue;
        const left = Math.max(1, dDiff(d, g.deadline) + 1);
        const u = (g.lessons.length / left) / (1 + (taken.get(g) || 0) * 0.6);
        if (u > bestU){ bestU = u; best = g; }
      }
      if (!best) break;
      // 一次排同一課的兩個項目（例如讀課本＋作筆記），讀起來比較連貫
      const first = best.lessons.shift(); add(d, first); cap--;
      let n = 1;
      if (cap > 0 && best.lessons.length && best.lessons[0].lesson === first.lesson){ add(d, best.lessons.shift()); cap--; n++; }
      taken.set(best, (taken.get(best) || 0) + n);
    }
  }
  for (const g of bySubj.values()) if (g.lessons.length){ tight = true; late += g.lessons.length; for (const it of g.lessons) add(dAdd(g.subj.date, -1) < startDay ? startDay : dAdd(g.subj.date, -1), it); }
  return {days, tight, late};
}
// 今天的清單：一天之中固定不變（勾選後不會跑出新的項目），換一天或改了設定才重排
function planToday(){
  const t0 = todayISO(), ver = planVersion();
  const all = planItems(), byKey = new Map(all.map(it => [it.key, it]));
  if (!PLAN.today || PLAN.today.date !== t0 || PLAN.today.ver !== ver){
    const keep = PLAN.today && PLAN.today.date === t0 ? PLAN.today.keys.filter(k => PLAN.done[k] === t0 && byKey.has(k)) : [];
    const pending = all.filter(it => !PLAN.done[it.key] && !keep.includes(it.key));
    const sch = planSchedule(pending, t0);
    const fresh = (sch.days.get(t0) || []).map(it => it.key);
    PLAN.today = {date: t0, ver, keys: keep.concat(fresh.filter(k => !keep.includes(k)))};
    planSave();
  }
  return PLAN.today.keys.map(k => byKey.get(k)).filter(Boolean);
}
function planFuture(){
  const t0 = todayISO(), todayKeys = new Set(PLAN.today ? PLAN.today.keys : []);
  const pending = planItems().filter(it => !PLAN.done[it.key] && !todayKeys.has(it.key));
  return planSchedule(pending, dAdd(t0, 1));
}
function planProgress(){
  const t0 = todayISO(), rows = [];

    if (!s.date) continue;
    const keys = planItemsFor(ex, s);
    const done = keys.filter(k => PLAN.done[k]).length;
    rows.push({ex, s, total: keys.length, done, pct: keys.length ? Math.round(done / keys.length * 100) : 0, past: s.date < t0});
  }
  return rows;
}
function planItemsFor(ex, s){
  const keys = [], from = Math.min(s.from, s.to), to = Math.max(s.from, s.to);
  for (let n = from; n <= to; n++) for (const t of PLAN.types.filter(t => t.on)) keys.push(`${ex.id}|${s.id}|L${n}|${t.id}`);
  for (let k = 1; k <= PLAN.reviewDays; k++) keys.push(`${ex.id}|${s.id}|R${k}`);
  return keys;
}

    </div>
    <label class="toggle"><input type="checkbox" id="plWeekend" ${PLAN.weekendMore ? 'checked' : ''}>週末多排 2 項</label>
    <p class="pl-note">讀書計畫只存在這台平板的瀏覽器裡。清除瀏覽器資料會不見，換一台平板也要重新設定。</p>`;
  body.querySelectorAll('[data-on]').forEach(cb => cb.onchange = () => { PLAN.types.find(t => t.id === cb.dataset.on).on = cb.checked; planSave(); });
  body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { PLAN.types = PLAN.types.filter(t => t.id !== b.dataset.rm); planSave(); renderPlanItems(); });
  $('#plRev').onchange = ev => { PLAN.reviewDays = +ev.target.value; planSave(); };
  $('#plNewType').onsubmit = ev => { ev.preventDefault(); const n = $('#plTypeName').value.trim(); if (!n) return; PLAN.types.push({id: 'c' + pid(), name: n, icon: '🌟', on: true}); planSave(); renderPlanItems(); };
  body.querySelectorAll('.pl-amount button').forEach(b => b.onclick = () => { PLAN.perDay = +b.dataset.n; planSave(); renderPlanItems(); });
  $('#plWeekend').onchange = ev => { PLAN.weekendMore = ev.target.checked; planSave(); };
}
function plannerStop(){ document.body.classList.remove('planning'); }

const welcomeHTML = main.innerHTML;
function showWelcome(){
  main.innerHTML = welcomeHTML;
  main.querySelectorAll('.say-examples button').forEach(b => b.onclick = () => handleInput(b.dataset.say, {voice:true}));
  const sb = $('#startBtn'); if (sb) sb.onclick = greet;
  const gb = $('#gameBtn2'); if (gb) gb.onclick = openGameHub;
  const pb = $('#planBtn2'); if (pb) pb.onclick = () => openPlanner();
  const ln = $('#loadNote'); if (ln && DICT) ln.textContent = '資料來源：教育部《國語辭典簡編本》《重編國語辭典修訂本》《成語典》';
}
$('#gameBtn').onclick = openGameHub;
$('#gameBtn2').onclick = openGameHub;
$('#planBtn').onclick = () => openPlanner();
$('#planBtn2').onclick = () => openPlanner();

/* ================= 開場 ================= */
document.querySelectorAll('.say-examples button').forEach(b => b.onclick = () => handleInput(b.dataset.say, {voice:true}));
function greet(){
  setHear('請問我要幫你查哪個字詞？', true);
  speak('請問我要幫你查哪個字詞？按住黃色的麥克風說話，說完放開。', {rate: 0.9, onEnd: () => setHear('按住麥克風說話，說完放開', true)});
}
$('#startBtn').onclick = greet;
// 安裝版 app 一打開就會說話（網頁版要先按「開始查字」）
window.__appReady = () => setTimeout(greet, 400);

/* ================= 網頁版：加到主畫面、離線使用 ================= */
if (!NATIVE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').hidden = true; });
$('#installBtn').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch(e){}
  installEvt = null; $('#installBtn').hidden = true;
};
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (cur && cur.chars && $('#writer')) setupStrokes(cur.chars[selChar]); }, 300); });
</script>
