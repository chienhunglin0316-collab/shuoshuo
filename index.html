<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9FDBFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>說說字典</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Fredoka:wght@500;600&family=Huninn&display=swap">
<script src="hanzi-writer.min.js"></script>
<style>
/* Layout: 童趣天空 — 白天是藍天白雲，晚上是星空；卡片像糖果一樣圓圓胖胖、有立體感。
   左邊田字格寫字區，右邊資料卡；底部固定語音列。 */
:root{
  --paper:#FFF6E3; --card:#FFFFFF; --ink:#2B2D5C; --ink-soft:#64679A;
  --grid:#9DC3F2; --grid-soft:#DDEBFC; --red:#F0474D; --sun:#FFC83D; --sun-ink:#4A3200;
  --blue:#2F7BEA; --outline:#E2E5F6; --shadow:0 5px 0 rgba(43,45,92,.10);
  --pink:#FF8FB8; --green:#3DBE84; --purple:#8B6CFF; --orange:#FF9A3C; --teal:#2EC4C9;
  --sky1:#9FDBFF; --sky2:#DDF3FF; --sky3:#FFF4DD; --cloud:#FFFFFF; --sun-deep:#E2A21A;
  --t-pink:#FFE3EE; --t-green:#DDF6EA; --t-purple:#ECE6FF; --t-orange:#FFEBD8; --t-blue:#DDEBFF; --t-yellow:#FFF3C9;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","KaiTi",serif;
  --f-round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-en:"Fredoka","Nunito","Arial Rounded MT Bold",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#262B66;--card:#2F3577;--ink:#F5F6FF;--ink-soft:#BEC1EC;--grid:#6870C4;--grid-soft:#3D4392;
  --red:#FF7B80;--sun:#FFD460;--sun-ink:#3A2700;--blue:#8BB8FF;--outline:#474EA3;--shadow:0 5px 0 rgba(0,0,0,.28);
  --pink:#FF9EC4;--green:#5DD6A0;--purple:#B3A0FF;--orange:#FFB168;--teal:#5ED8DC;
  --sky1:#141748;--sky2:#22276A;--sky3:#363C88;--cloud:#FFF6C8;--sun-deep:#C98F12;
  --t-pink:#4A3374;--t-green:#2C4C78;--t-purple:#3E3A8A;--t-orange:#4D3A70;--t-blue:#2D407F;--t-yellow:#4A4370;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#262B66;--card:#2F3577;--ink:#F5F6FF;--ink-soft:#BEC1EC;--grid:#6870C4;--grid-soft:#3D4392;
  --red:#FF7B80;--sun:#FFD460;--sun-ink:#3A2700;--blue:#8BB8FF;--outline:#474EA3;--shadow:0 5px 0 rgba(0,0,0,.28);
  --pink:#FF9EC4;--green:#5DD6A0;--purple:#B3A0FF;--orange:#FFB168;--teal:#5ED8DC;
  --sky1:#141748;--sky2:#22276A;--sky3:#363C88;--cloud:#FFF6C8;--sun-deep:#C98F12;
  --t-pink:#4A3374;--t-green:#2C4C78;--t-purple:#3E3A8A;--t-orange:#4D3A70;--t-blue:#2D407F;--t-yellow:#4A4370;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--f-sans);font-size:18px;line-height:1.6;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
[hidden]{display:none!important}

.app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;padding-block:14px}
.logo{font-family:var(--f-kai);font-weight:700;font-size:30px;letter-spacing:.08em;display:flex;align-items:center;gap:10px;flex:none}
.logo-mark{width:44px;height:44px;border:2.5px solid var(--red);border-radius:10px;display:grid;place-items:center;color:var(--red);font-size:28px}
.spacer{flex:1}
.history{display:flex;gap:8px;overflow-x:auto;min-width:0;scrollbar-width:none}
.history::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-kai);font-size:22px;padding:4px 16px;border-radius:999px;background:var(--card);border:2px solid var(--outline);box-shadow:var(--shadow)}
.chip.en{font-family:var(--f-en)}
.chip:active,.btn:active,.words button:active{transform:translateY(2px)}

.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding-block:20px}
.welcome h1{font-family:var(--f-kai);font-size:clamp(34px,6vw,56px);margin:0;line-height:1.3;text-wrap:balance}
.welcome p{margin:0;color:var(--ink-soft);font-size:20px}
.say-examples{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:820px}
.say-examples button{font-family:var(--f-kai);font-size:22px;padding:10px 20px;border-radius:16px;background:var(--card);border:2px dashed var(--grid)}
.big-start{font-family:var(--f-kai);font-size:32px;font-weight:700;padding:18px 48px;border-radius:24px;background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #D9A21C}
.big-start:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A21C}

.result{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:20px;align-items:start}
@media (max-width:860px){.result{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--outline);border-radius:22px;padding:20px;box-shadow:var(--shadow);min-width:0}
.src{font-size:13px;color:var(--ink-soft);margin-top:14px}

.word-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:14px}
.tile{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 12px;border-radius:14px;border:2px solid transparent}
.tile.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,transparent)}
.tile .hz{font-family:var(--f-kai);font-size:44px;line-height:1}
.word-row.single .tile .hz{font-size:70px}
.zy{display:inline-flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.05;position:relative;padding-right:9px;min-width:22px;vertical-align:middle}
.word-row.single .zy{font-size:22px;padding-right:12px}
.zy .light{line-height:.8}
.zy .tone{position:absolute;right:-3px;top:50%;transform:translateY(-50%)}

.stage-wrap{display:flex;justify-content:center}
.stage{position:relative;width:min(100%,340px);aspect-ratio:1;max-width:100%;border:3px solid var(--red);border-radius:6px;background:var(--card)}
.stage svg.grid,.stage .writer,.stage .stepview{position:absolute;inset:0;width:100%;height:100%}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kai);font-size:220px;line-height:1}
.stroke-badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:2px 12px;font-size:16px}
.stage-note{text-align:center;color:var(--ink-soft);font-size:16px;margin-top:6px;min-height:26px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;border-radius:16px;background:var(--paper);border:2px solid var(--outline);font-weight:700;font-size:17px;min-height:64px}
.btn .ic{font-size:22px;line-height:1}
.btn.primary{background:var(--red);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.strip button{width:58px;height:58px;border:1.5px solid var(--grid);border-radius:6px;background:var(--card);position:relative;padding:0}
.strip button.on{border-color:var(--red);border-width:3px}
.strip svg{width:100%;height:100%;display:block}
.strip i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px;color:var(--ink-soft)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.fact{border:2px solid var(--outline);border-radius:16px;padding:10px 14px;background:var(--paper);display:flex;flex-direction:column;gap:2px}
.fact .k{font-size:14px;color:var(--ink-soft);letter-spacing:.1em}
.fact .v{font-family:var(--f-kai);font-size:34px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fact .v small{font-size:18px;font-weight:400;color:var(--ink-soft)}
.mini-say{font-size:15px;font-family:var(--f-sans);padding:4px 10px;border-radius:999px;background:var(--sun);color:var(--sun-ink);font-weight:700}

.heading{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-family:var(--f-kai);font-size:26px;font-weight:700;flex-wrap:wrap}
.heading::before{content:"";width:10px;height:26px;border-radius:3px;background:var(--red)}
.heading .speak{margin-left:auto}
.speak{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-family:var(--f-sans);font-weight:700;padding:8px 16px;border-radius:999px;background:var(--sun);color:var(--sun-ink)}
.speak.playing{background:var(--red);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.tabs button{padding:4px 14px;border-radius:999px;border:2px solid var(--outline);font-size:18px}
.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.variant{font-size:16px;color:var(--ink-soft);margin:0 0 8px}

ol.defs{margin:0;padding-left:1.6em;font-size:20px}
ol.defs li{margin-bottom:10px}
.pos{display:inline-block;font-size:14px;padding:0 8px;margin-right:6px;border-radius:6px;background:var(--grid-soft);color:var(--ink);vertical-align:2px}
.eg{display:block;color:var(--ink-soft);font-size:18px}
.eg b{color:var(--red);font-weight:700}
.more{margin-top:4px;color:var(--red);font-weight:700;font-size:17px}

.words{display:flex;flex-wrap:wrap;gap:10px}
.words button{font-family:var(--f-kai);font-size:26px;padding:6px 18px;border-radius:14px;background:var(--paper);border:2px solid var(--grid)}
.words button.en{font-family:var(--f-en);font-size:22px}
.sentences{display:flex;flex-direction:column;gap:10px}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:var(--paper);border:2px solid var(--outline)}
.sent .tx{flex:1;min-width:0;font-size:20px}
.sent .tx .zh{display:block;color:var(--ink-soft);font-size:18px}
.sent .en-t{font-family:var(--f-en);font-size:21px}
.round{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-size:20px;display:grid;place-items:center}

.story{font-family:var(--f-kai);font-size:23px;line-height:1.9;margin:0;padding:16px 20px;border-radius:16px;background:var(--paper);border:2px dashed var(--grid);-webkit-user-select:text;user-select:text}
.story .cur{background:color-mix(in srgb,var(--sun) 55%,transparent);border-radius:4px}
.lesson{margin-top:12px;font-size:20px}
.lesson b{color:var(--red)}

/* 英文 */
.en-word{font-family:var(--f-en);font-size:clamp(48px,9vw,84px);font-weight:600;text-align:center;line-height:1.1;word-break:break-word}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.letters span{font-family:var(--f-en);font-size:30px;font-weight:600;width:48px;height:56px;display:grid;place-items:center;border-radius:12px;background:var(--paper);border:2px solid var(--outline)}
.letters span.cur{background:var(--sun);border-color:var(--sun)}
.kk{text-align:center;font-size:26px;font-family:"Noto Sans","Lucida Sans Unicode","Arial Unicode MS",sans-serif;color:var(--blue)}
.zh-big{font-family:var(--f-kai);font-size:40px;font-weight:700;text-align:center;line-height:1.3}
.en-sentence{font-family:var(--f-en);font-size:30px;line-height:1.5;text-align:center}
.en-sentence button{font:inherit;padding:0 4px;border-radius:8px;border-bottom:2px dotted var(--grid)}
.en-defs li{font-size:18px}
.en-defs .zh{display:block;font-size:19px;color:var(--ink)}
.en-defs .en-t{display:block;font-family:var(--f-en);color:var(--ink-soft);font-size:17px}

/* 拍照 */
.photo-wrap{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:20px;align-items:start}
@media (max-width:760px){.photo-wrap{grid-template-columns:1fr}}
.photo-wrap img{width:100%;border-radius:16px;border:2px solid var(--outline)}
.ocr-line{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--grid)}
.ocr-line button{font-family:var(--f-kai);font-size:30px;min-width:56px;padding:4px 12px;border-radius:12px;background:var(--paper);border:2px solid var(--outline)}
.ocr-line button.w{border-color:var(--red);color:var(--red)}
.ocr-line button.en{font-family:var(--f-en);font-size:24px}
.progress{height:14px;border-radius:999px;background:var(--grid-soft);overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--red);width:0;transition:width .3s}

/* 造詞卡片 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(760px,100%);max-height:86%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sheet-top .close{margin-left:auto;width:48px;height:48px;border-radius:50%;background:var(--paper);font-size:24px}
.sheet .word-row{justify-content:flex-start;margin:0}

.notfound{text-align:center;padding:30px 10px}
.notfound h2{font-family:var(--f-kai);font-size:32px;margin:0 0 8px}
.loading{display:flex;justify-content:center;padding:60px 0;font-family:var(--f-kai);font-size:28px;color:var(--ink-soft)}

/* 底部語音列 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-top:2px solid var(--outline);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px}
.mic-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.mic{touch-action:none;-webkit-touch-callout:none;width:100px;height:100px;border-radius:50%;background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 #D9A21C;display:grid;place-items:center;position:relative}
.mic svg{width:48px;height:48px}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A21C}
.mic.listening{background:var(--red);color:#fff;box-shadow:0 6px 0 #9E2C24}
.mic.listening::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--red);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.lang{display:flex;border-radius:999px;border:2px solid var(--outline);overflow:hidden;background:var(--card)}
.lang button{padding:2px 12px;font-size:15px;font-weight:700}
.lang button.on{background:var(--ink);color:var(--card)}
.dock-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hear{font-family:var(--f-kai);font-size:24px;min-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hear.hint{color:var(--ink-soft);font-family:var(--f-sans);font-size:18px}
.type-row{display:flex;gap:8px}
.type-row input{flex:1;min-width:0;font-family:var(--f-kai);font-size:24px;padding:8px 14px;border-radius:14px;border:2px solid var(--outline);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.type-row .go{padding:0 20px;border-radius:14px;background:var(--ink);color:var(--card);font-weight:700;font-size:20px}
.cam{flex:none;width:76px;height:76px;border-radius:22px;background:var(--card);border:2px solid var(--outline);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;gap:2px}
.cam .ic{font-size:30px;line-height:1}
@media (max-width:560px){.mic{width:80px;height:80px}.cam{width:60px;height:60px}.cam span:last-child{display:none}}
@media (prefers-reduced-motion:reduce){.mic.listening::after{animation:none}}

/* 小遊戲：念字打雷射 */
.game-btn{flex:none;font-weight:700;font-size:17px;padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--card)}
body.gaming .dock{display:none}
body.gaming .app{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.game-intro{max-width:760px;margin:0 auto;text-align:center}
.game-intro h2{font-family:var(--f-kai);font-size:44px;margin:4px 0}
.rules{text-align:left;font-size:20px;margin:12px auto;max-width:560px;padding-left:1.4em}
.diff{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.diff button{font-family:var(--f-kai);font-size:26px;font-weight:700;padding:12px 26px;border-radius:18px;border:3px solid var(--outline);background:var(--paper)}
.diff button.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.diff small{display:block;font-family:var(--f-sans);font-size:14px;font-weight:400;color:var(--ink-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:19px;margin-bottom:14px}
.toggle input{width:26px;height:26px;accent-color:var(--red)}
.game{display:flex;flex-direction:column;gap:8px;align-items:center}
.hud{display:flex;gap:10px;align-items:center;width:100%;max-width:900px;flex-wrap:wrap}
.hud > div{background:var(--card);border:2px solid var(--outline);border-radius:14px;padding:2px 14px;display:flex;align-items:baseline;gap:8px}
.hud .k{font-size:14px;color:var(--ink-soft)}
.hud b{font-size:26px;font-variant-numeric:tabular-nums}
.hud-btn{padding:8px 16px;border-radius:14px;background:var(--card);border:2px solid var(--outline);font-weight:700}
.board-wrap{position:relative;max-width:100%}
#gc{display:block;border-radius:16px;border:3px solid var(--ink);background:var(--card);touch-action:manipulation;max-width:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:16px;padding:20px;overflow:auto}
.overlay h2{font-family:var(--f-kai);font-size:48px;margin:0}
.overlay .big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.g-hear{display:flex;align-items:center;gap:12px;font-family:var(--f-kai);font-size:28px;min-height:56px;max-width:100%}
.g-mic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sun);font-size:26px;flex:none}
.g-mic.on{background:var(--red);animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.g-hit{color:var(--red);font-weight:700}
@media (prefers-reduced-motion:reduce){.g-mic.on{animation:none}}

/* ================= 童趣風格 ================= */
/* 背景天空：白天雲朵、晚上星星，慢慢飄 */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 48%,var(--sky3) 100%)}
.sky .cl{position:absolute;color:var(--cloud);opacity:.9;animation:drift 38s linear infinite}
.sky .cl svg{display:block;width:100%;height:auto}
.sky .c1{top:7%;left:-12%;width:190px;animation-duration:46s}

:root[data-theme="dark"] .sky .stars{display:block}:root[data-theme="dark"] .sky .cl{opacity:.12}

.pl-addexam{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.pl-types{display:flex;flex-direction:column;gap:8px}

.pl-type input{width:28px;height:28px;accent-color:var(--green)}

.pl-review select{font:inherit;padding:4px 6px;border-radius:10px;border:2px solid var(--outline);background:var(--paper);color:var(--ink)}
.pl-newtype{display:flex;gap:8px;flex-wrap:wrap}
.pl-newtype input{flex:1;min-width:220px;font-family:var(--f-round);font-size:20px;padding:8px 12px;border-radius:16px;border:3px solid var(--outline);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.pl-amount{display:flex;gap:8px;flex-wrap:wrap}
.pl-amount button{font-family:var(--f-round);font-size:18px;padding:8px 16px;border-radius:999px;background:var(--card);border:3px solid var(--outline)}
.pl-amount button.on{background:var(--green);border-color:var(--green);color:#fff}

/* 遊戲選單 */
.hub{max-width:980px;margin:0 auto;text-align:center;padding-top:6px}
.hub h2{font-family:var(--f-round);font-weight:400;font-size:clamp(32px,5vw,46px);margin:0 0 18px;color:var(--purple)}
.hub-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.hub-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 18px 22px;border-radius:32px;background:var(--card);border:4px solid var(--outline);box-shadow:0 8px 0 rgba(43,45,92,.1);text-align:center}
.hub-card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(43,45,92,.1)}
.hub-card .art{font-size:64px;line-height:1.1;letter-spacing:4px}
.hub-card b{font-family:var(--f-round);font-weight:400;font-size:30px}
.hub-card small{font-size:17px;color:var(--ink-soft)}
.hub-card.c1{background:var(--t-pink);border-color:var(--pink)}
.hub-card.c2{background:var(--t-blue);border-color:var(--blue)}
.hub-card.c3{background:var(--t-green);border-color:var(--green)}
.hub-card.c4{background:var(--t-orange);border-color:var(--orange)}
.hub-card.c5{background:var(--t-purple);border-color:var(--purple)}
.hub-card.c6{background:var(--t-yellow);border-color:var(--sun-deep)}
/* 接龍 */
.chain{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.chain .hud > div:nth-child(3){background:var(--t-pink)}
.ch-list{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:12px 6px 16px;min-height:132px;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:26px;scrollbar-width:thin}
.ch-empty{margin:0 auto;font-family:var(--f-round);font-size:22px;color:var(--ink-soft);text-align:center;padding:0 12px}
.ch-card{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px 12px;border-radius:22px;border:4px solid var(--blue);background:var(--t-blue);box-shadow:0 5px 0 rgba(43,45,92,.12);position:relative;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.ch-card.pc{border-color:var(--pink);background:var(--t-pink)}
.ch-card i{font-style:normal;font-family:var(--f-round);font-size:13px;color:var(--ink-soft)}
.ch-card .w{font-family:var(--f-kai);font-weight:700;font-size:34px;line-height:1.15;white-space:nowrap}
.ch-card .w.en{font-family:var(--f-en);font-weight:600;font-size:30px}
.ch-card .w b{color:var(--red);font-size:1.15em}
.ch-card small{font-size:14px;color:var(--ink-soft);white-space:nowrap}
.ch-card .em{font-size:30px;line-height:1}
.ch-arrow{flex:none;font-size:26px;color:var(--ink-soft)}
.ch-target{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;min-height:20px}
.ch-target:empty{display:none}
.ch-big{display:grid;place-items:center;width:104px;height:104px;border-radius:28px;background:var(--sun);color:var(--sun-ink);font-family:var(--f-kai);font-weight:700;font-size:64px;line-height:1;box-shadow:0 7px 0 var(--sun-deep);animation:bob 2.6s ease-in-out infinite}
.ch-big small{font-family:var(--f-sans);font-size:15px;font-weight:500;margin-top:-6px}
.ch-big.en{font-family:var(--f-en);font-weight:600}
.ch-tip{font-family:var(--f-round);font-size:26px;text-align:center}

.ch-heard{font-family:var(--f-round);font-size:22px;color:var(--ink-soft);text-align:center;min-height:30px}
.ch-msg{font-family:var(--f-round);font-size:22px;text-align:center;min-height:32px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ch-msg.ok{color:var(--green)}
.ch-msg.warn{color:var(--red)}
.ch-msg .en{font-family:var(--f-en)}
.ch-sug{display:inline-flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:16px;background:var(--t-purple);color:var(--ink)}
.ch-sug b{font-family:var(--f-kai);font-size:24px}
.ch-sug b.en{font-family:var(--f-en)}
.ch-sug small{font-family:var(--f-sans);font-size:13px;color:var(--ink-soft);max-width:220px}
.ch-left{font-size:16px;color:var(--ink-soft)}
.ch-ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.ch-mic{touch-action:none;-webkit-touch-callout:none;width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;line-height:1;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--sun) 60%);box-shadow:0 7px 0 var(--sun-deep),0 0 0 6px color-mix(in srgb,var(--sun) 30%,transparent);position:relative;flex:none}
.ch-mic small{font-family:var(--f-round);font-size:15px;margin-top:4px;color:var(--sun-ink)}
.ch-mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.ch-mic.listening{background:radial-gradient(circle at 35% 30%,#FF9A9D,var(--red) 60%)}
.ch-mic.listening small{color:#fff}
.ch-mic.listening::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--red);animation:pulse 1.2s ease-out infinite}
.ch-form{display:flex;gap:8px;flex:1;min-width:240px;max-width:460px}
.ch-form input{flex:1;min-width:0;font-family:var(--f-round);font-size:24px;padding:10px 14px;border-radius:18px;border:3px solid var(--outline);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.ch-form button{padding:0 20px;border-radius:18px;background:var(--blue);color:#fff;font-family:var(--f-round);font-size:22px;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.ch-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ch-btns button{font-family:var(--f-round);font-size:20px;padding:10px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(43,45,92,.14)}
.ch-btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,45,92,.14)}
.ch-help{background:var(--t-purple);color:var(--ink)}
.ch-help:disabled{opacity:.45}
.ch-pc{background:var(--t-green);color:var(--ink)}
.ch-giveup{background:var(--t-pink);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ch-card,.ch-big,.ch-mic.listening::after{animation:none}}
/* 年級 */
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:10px 0 16px}
@media (max-width:640px){.grades{grid-template-columns:repeat(3,1fr)}}
.grades button{font-family:var(--f-round);font-size:22px;padding:12px 4px;border-radius:20px;border:4px solid var(--outline);background:var(--card);box-shadow:0 4px 0 rgba(43,45,92,.1);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.grades button small{font-size:13px;color:var(--ink-soft);font-family:var(--f-sans)}
.grades button:nth-child(1).on{border-color:var(--pink);background:var(--t-pink)}.grades button:nth-child(2).on{border-color:var(--orange);background:var(--t-orange)}
.grades button:nth-child(3).on{border-color:var(--sun-deep);background:var(--t-yellow)}.grades button:nth-child(4).on{border-color:var(--green);background:var(--t-green)}
.grades button:nth-child(5).on{border-color:var(--blue);background:var(--t-blue)}.grades button:nth-child(6).on{border-color:var(--purple);background:var(--t-purple)}
.spell-note{font-size:17px;color:var(--ink-soft);margin:0 0 16px}
/* 拼字 */
.spell{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.spell .hud > div:nth-child(1){background:var(--t-blue)}
.sp-time{height:16px;border-radius:999px;background:var(--grid-soft);overflow:hidden}
.sp-time div{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .1s linear;border-radius:999px}
.sp-time div.low{background:linear-gradient(90deg,var(--red),var(--orange))}
.sp-card{background:var(--card);border-radius:34px;border:4px solid var(--outline);box-shadow:0 8px 0 rgba(43,45,92,.08);padding:20px 18px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-pic{font-size:clamp(90px,16vw,130px);line-height:1;animation:bob 2.6s ease-in-out infinite}
.sp-zh{font-family:var(--f-round);font-size:30px}
.sp-say{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sp-say .speak{font-size:19px;padding:10px 18px}
.sp-hint{background:var(--t-purple)!important;color:var(--ink)!important;box-shadow:0 3px 0 rgba(43,45,92,.15)!important}
.sp-slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sp-slots span{width:clamp(44px,8vw,62px);height:clamp(54px,9.5vw,74px);border-radius:16px;border:4px dashed var(--grid);display:grid;place-items:center;font-family:var(--f-en);font-weight:600;font-size:clamp(30px,5.5vw,44px);background:var(--paper)}
.sp-slots span.fill{border-style:solid;border-color:var(--blue);background:var(--t-blue)}
.sp-slots span.pop{animation:popin .3s cubic-bezier(.3,1.6,.5,1)}
.sp-slots.win span{border-color:var(--green);background:var(--t-green)}
.sp-slots.late span{border-color:var(--red);background:var(--t-pink)}
.sp-tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.sp-tiles button{width:clamp(56px,10vw,74px);height:clamp(56px,10vw,74px);border-radius:20px;font-family:var(--f-en);font-weight:600;font-size:clamp(30px,5.5vw,42px);background:var(--sun);color:var(--sun-ink);box-shadow:0 6px 0 var(--sun-deep)}
.sp-tiles button:nth-child(4n+2){background:var(--pink);color:#3a0f22;box-shadow:0 6px 0 color-mix(in srgb,var(--pink) 60%,#000)}
.sp-tiles button:nth-child(4n+3){background:var(--teal);color:#06343a;box-shadow:0 6px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.sp-tiles button:nth-child(4n+4){background:var(--purple);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--purple) 60%,#000)}
.sp-tiles button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sp-tiles button.used{visibility:hidden}
.sp-tiles button.glow{outline:5px solid var(--green);outline-offset:3px}
.sp-tiles button.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px) rotate(-4deg)}40%,80%{transform:translateX(8px) rotate(4deg)}}
.sp-msg{min-height:36px;font-family:var(--f-round);font-size:26px;color:var(--ink)}
.sp-msg b{font-family:var(--f-en);color:var(--red)}
.sp-got{letter-spacing:4px}
.sp-next{font-size:28px;padding:14px 40px}
.sp-final{font-family:var(--f-en);font-size:84px;color:var(--orange);line-height:1;text-shadow:0 6px 0 color-mix(in srgb,var(--orange) 30%,transparent)}
@media (prefers-reduced-motion:reduce){.sp-pic,.sp-slots span.pop,.sp-tiles button.shake{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sunball"></div>
  <div class="stars"></div>
  <div class="cl c1"><svg viewBox="0 0 120 60"><path fill="currentColor" d="M28 58a20 20 0 0 1-4-39.6A24 24 0 0 1 70 12a18 18 0 0 1 28 14 16 16 0 0 1-2 32Z"/></svg></div>
  <div class="cl c2"><svg viewBox="0 0 120 60"><path fill="currentColor" d="M28 58a20 20 0 0 1-4-39.6A24 24 0 0 1 70 12a18 18 0 0 1 28 14 16 16 0 0 1-2 32Z"/></svg></div>
  <div class="cl c3"><svg viewBox="0 0 120 60"><path fill="currentColor" d="M28 58a20 20 0 0 1-4-39.6A24 24 0 0 1 70 12a18 18 0 0 1 28 14 16 16 0 0 1-2 32Z"/></svg></div>
  <div class="cl c4"><svg viewBox="0 0 120 60"><path fill="currentColor" d="M28 58a20 20 0 0 1-4-39.6A24 24 0 0 1 70 12a18 18 0 0 1 28 14 16 16 0 0 1-2 32Z"/></svg></div>
  <div class="hill"></div>
</div>
<div class="app">
  <header>
    <div class="logo"><span class="logo-mark">字</span>說說<b>字典</b></div>
    <button class="game-btn" id="gameBtn">🎮 玩遊戲</button>
    <button class="plan-btn" id="planBtn">📅 讀書計畫</button>
    <button class="install-btn" id="installBtn" hidden>📲 加到主畫面</button>
    <div class="spacer"></div>
    <div class="history" id="history" aria-label="查過的字"></div>
  </header>
  <main id="main">
    <section class="welcome" id="welcome">
      <div class="hero">
        <svg class="mascot" viewBox="0 0 200 210" aria-hidden="true">
          <!-- 吉祥物「字寶」：一本會說話的小書 -->
          <ellipse cx="100" cy="200" rx="58" ry="8" fill="rgba(43,45,92,.12)"/>
          <path d="M100 52 C70 36 38 38 22 46 V176 C38 168 70 166 100 182 Z" fill="#FF8FB8"/>
          <path d="M100 52 C130 36 162 38 178 46 V176 C162 168 130 166 100 182 Z" fill="#7DB8FF"/>
          <path d="M100 60 C74 46 46 48 32 54 V166 C46 160 74 160 100 172 Z" fill="#FFFFFF"/>
          <path d="M100 60 C126 46 154 48 168 54 V166 C154 160 126 160 100 172 Z" fill="#FFFFFF"/>
          <path d="M100 58 V178" stroke="#2B2D5C" stroke-width="4" stroke-linecap="round"/>
          <g fill="#2B2D5C">
            <ellipse cx="66" cy="108" rx="9" ry="12"/><ellipse cx="134" cy="108" rx="9" ry="12"/>
          </g>
          <circle cx="69" cy="103" r="3.5" fill="#fff"/><circle cx="137" cy="103" r="3.5" fill="#fff"/>
          <ellipse cx="52" cy="130" rx="10" ry="6" fill="#FFB3CC"/><ellipse cx="148" cy="130" rx="10" ry="6" fill="#FFB3CC"/>
          <path d="M84 132 Q100 150 116 132" fill="#FF6B7A" stroke="#2B2D5C" stroke-width="4" stroke-linejoin="round"/>
          <path d="M100 30 V50" stroke="#2B2D5C" stroke-width="4" stroke-linecap="round"/>
          <circle cx="100" cy="24" r="9" fill="#FFC83D" stroke="#2B2D5C" stroke-width="4"/>
          <path d="M22 120 Q4 112 8 94" stroke="#2B2D5C" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M178 120 Q198 104 188 84" stroke="#2B2D5C" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="188" cy="80" r="7" fill="#FFC83D" stroke="#2B2D5C" stroke-width="3"/>

        <div class="bubble"><h1>請問我要幫你<br>查哪個<span class="hl">字詞</span>？</h1></div>
      </div>

      <div class="feature-row">
        <span class="feature"><i>🎤</i>說說看</span>

<div class="dock">
  <div class="dock-inner">
    <div class="mic-col">
      <button class="mic" id="mic" aria-label="按這裡說話">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/></svg>

<script>
/* ================= 成語故事：小朋友版（另附教育部《成語典》典故說明原文） ================= */
const KID_STORIES = {
  "守株待兔":"從前宋國有一個農夫在田裡工作。有一天，一隻兔子跑得太快，一頭撞上田邊的樹樁，就這樣死了。農夫撿到兔子，高興得不得了。從此他不再種田，每天坐在樹樁旁邊，等著下一隻兔子撞上來。結果一直等、一直等，再也沒有兔子撞過來，田裡也長滿了雜草。",
  "畫蛇添足":"古時候，有幾個人要分一壺酒，可是酒只夠一個人喝。大家說好：誰最先在地上畫好一條蛇，酒就給誰。有一個人很快就畫好了，他拿起酒壺得意地說：「我還來得及幫蛇畫上腳呢！」他正在畫腳的時候，另一個人也畫好了，搶過酒壺說：「蛇本來就沒有腳，你畫的不是蛇！」說完就把酒喝光了。",

  "揠苗助長":"宋國有一個農夫，種了一片稻苗。他每天去田裡看，總覺得稻苗長得太慢。有一天，他想到一個辦法：把每一棵稻苗都往上拔高一點。他忙了一整天，回家還得意地說：「我今天幫稻苗長高了！」兒子跑去田裡一看，稻苗全都枯死了。",
  "對牛彈琴":"古時候有一位很會彈琴的音樂家，叫做公明儀。有一天，他看見一頭牛在吃草，就對著牛彈了一首很優美的曲子。可是牛還是低著頭吃草，一點反應也沒有。後來他改彈像蚊子、小牛叫的聲音，牛才搖搖尾巴、豎起耳朵聽。",

  "掩耳盜鈴":"有一個小偷看到一口大鐘，想把它偷走。可是鐘太大背不動，他就想把鐘敲碎再拿。一敲，鐘就發出很大的聲音，他怕別人聽到，趕快摀住自己的耳朵，以為自己聽不見，別人也就聽不見了。",

  "一鳴驚人":"楚莊王當上國王後，三年都不管國家大事。有個大臣就問他：「有一隻大鳥停在山上，三年不飛也不叫，這是什麼鳥呢？」楚莊王回答：「這隻鳥不飛則已，一飛就衝上天；不叫則已，一叫就讓人嚇一跳。」後來楚莊王認真治理國家，讓楚國變得非常強大。"
};

/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isHan = c => /\p{Script=Han}/u.test(c);
const hasLatin = s => /[A-Za-z]/.test(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const chars = s => [...s];

/* ================= 教育部字典資料 ================= */
let DICT = null, IDIOMS = null, CHARFREQ = null, WORDIDX = null;
const dictReady = (async () => {
  DICT = await (await fetch('dict.json')).json();
  $('#loadNote') && ($('#loadNote').textContent = '資料來源：教育部《國語辭典簡編本》《重編國語辭典修訂本》《成語典》');
  // 字頻（只算簡編本，越常出現越常用）
  CHARFREQ = new Map();
  for (const k in DICT) if (!DICT[k][0][6]) for (const c of k) CHARFREQ.set(c, (CHARFREQ.get(c) || 0) + 1);
})();
// 繁→簡對照（遊戲的離線辨識引擎用簡體字詞彙）
let TS = null;
const tsReady = fetch('ts.json').then(r => r.json()).then(j => TS = j).catch(() => TS = {});
const idiomsReady = (async () => { await dictReady; IDIOMS = await (await fetch('idioms.json')).json(); })();
function buildWordIndex(){
  if (WORDIDX) return;
  WORDIDX = new Map();
  for (const k in DICT){
    const n = chars(k).length;
    if (n < 2 || n > 4) continue;
    if (!chars(k).every(isHan)) continue;
    for (const c of new Set(chars(k))){ if (!WORDIDX.has(c)) WORDIDX.set(c, []); WORDIDX.get(c).push(k); }
  }
}
// 一個條目 → 多音字的每個讀音
function entry(t){ const e = DICT && DICT[t]; if (!e) return null;
  return e.map(r => ({zy:r[0], rad:(r[1]||'').trim(), strokes:r[2], def:r[3], variant:r[4], py:r[5], src:r[6] ? '重編國語辭典修訂本' : '國語辭典簡編本'})); }

// 解析釋義：1.xxx[例]aaa、bbb → [{pos, text, eg}]
function parseDef(def){
  const items = []; let pos = '';
  for (let line of (def || '').split('\n')){
    line = line.trim(); if (!line) continue;
    const pm = line.match(/^\[(.+?)\]$/); if (pm){ pos = pm[1]; continue; }
    line = line.replace(/^\d+\./, '');
    let [text, eg] = line.split('[例]');
    let see = '';
    text = text.replace(/\s*△(.+)$/, (m, s) => { see = s; return ''; });
    if (eg) eg = eg.replace(/\s*△.+$/, '');
    items.push({pos, text: text.trim(), eg: (eg || '').trim(), see});
  }
  return items;
}
// 從釋義例句找出造詞（例：冰水、熱水、白開水）
function egWords(e, ch){
  const out = [];
  for (const h of e) for (const it of parseDef(h.def)){
    if (!it.eg) continue;
    for (const w of it.eg.split(/[、，,]/)){ const x = w.trim(); if (x.length >= 2 && x.length <= 4 && x.includes(ch) && chars(x).every(isHan)) out.push(x); }
    for (const m of it.text.matchAll(/「([^」]{2,4})」/g)) if (m[1].includes(ch) && chars(m[1]).every(isHan)) out.push(m[1]);
  }
  return out;
}
// 每個字都要有造詞：先用字典例詞，再從簡編本詞目補足
// 人名、書名、地名等專有名詞，以及古代用語，不適合當小朋友的造詞
const PROPER = /^(\[名\]\n?)?(1\.)?(人名|書名|地名|水名|山名|國名|朝代名|篇名|官名|星名|姓|複姓|古國名|古地名|族名|樂府|詞牌|曲牌|宮名|縣名|郡名|州名|書篇名)/;
const kidOK = w => { const r = DICT[w][0]; return !PROPER.test(r[3]) && !/^\[[^\]]+\]\n?(1\.)?(古代|舊時|古時)/.test(r[3]); };
// 依「這個詞在教育部辭典裡被用到幾次」排序；簡編本的詞（國小程度）加分，二字詞優先
const wordScore = w => { const r = DICT[w][0]; const use = r[7] || 0; return (use + 1) * (r[6] ? 0.7 : 2) / Math.pow(chars(w).length - 1, 1.3); };
function wordsFor(ch, e){
  buildWordIndex();
  const set = new Set(egWords(e, ch).filter(w => DICT[w] && kidOK(w)).slice(0, 6));
  const cand = (WORDIDX.get(ch) || []).filter(kidOK);
  const score = wordScore;
  cand.sort((a, b) => score(b) - score(a));
  for (const w of cand){ if (set.size >= 12) break; set.add(w); }
  return [...set];
}
// 找含有某個詞的例句（字典裡其他條目的 [例]）
function findSentences(word, max = 3){
  const out = [];
  for (const k in DICT){
    for (const r of DICT[k]){
      const d = r[3]; if (!d || !d.includes(word) || !d.includes('[例]')) continue;
      for (const seg of d.split('[例]').slice(1)){
        for (const s of seg.split('\n')[0].split(/(?<=[。！？])/)){
          const t = s.replace(/\s*△.+$/, '').trim();
          if (t.includes(word) && t.length >= word.length + 4 && t.length < 60 && /[。！？]$/.test(t)) { out.push(t); if (out.length >= max) return out; }
        }
      }
    }
  }
  return out;
}

/* ================= 語音：說話 ================= */
const NATIVE = !!(window.Android && window.Android.speak);
let voices = {zh:null, en:null};
function pickVoices(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voices.zh = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  voices.en = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (!NATIVE && 'speechSynthesis' in window){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
let speakToken = 0, uid = 0; const ttsWait = {};
window.__ttsDone = id => { const f = ttsWait[id]; delete ttsWait[id]; f && f(); };
function sayOne(text, lang, rate){
  return new Promise(res => {
    if (NATIVE){ const id = 'u' + (++uid); ttsWait[id] = res; window.Android.speak(text, lang, rate, id); return; }
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = lang.startsWith('en') ? voices.en : voices.zh; if (v) u.voice = v; u.rate = rate;
    u.onend = res; u.onerror = res; speechSynthesis.speak(u);
  });
}
function stopSpeak(){
  speakToken++;
  if (NATIVE) window.Android.stopSpeak(); else if ('speechSynthesis' in window) speechSynthesis.cancel();
  Object.keys(ttsWait).forEach(k => window.__ttsDone(k));
  document.querySelectorAll('.playing').forEach(b => { b.classList.remove('playing'); if (b.dataset.label) b.innerHTML = b.dataset.label; });
}
async function speak(text, {lang = 'zh-TW', rate, onSentence, onEnd} = {}){
  stopSpeak();
  const token = speakToken;
  rate = rate ?? (lang.startsWith('en') ? 0.85 : 0.85);
  const parts = (lang.startsWith('en') ? text.match(/[^.!?]+[.!?]*/g) : text.match(/[^。！？!?；\n]+[。！？!?；」]*/g)) || [text];
  for (let i = 0; i < parts.length; i++){
    if (token !== speakToken) return;
    const p = parts[i].trim(); if (!p) continue;
    onSentence && onSentence(i);
    await sayOne(p, lang, rate);
  }
  if (token === speakToken) onEnd && onEnd();
}
// 按鈕：按一下念、再按一下停
function readBtn(btn, text, opts = {}){
  if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
  if (btn.classList.contains('playing')){ stopSpeak(); return; }
  speak(text, {...opts, onEnd: () => { btn.classList.remove('playing'); btn.innerHTML = btn.dataset.label; opts.onEnd && opts.onEnd(); }});
  btn.classList.add('playing'); btn.innerHTML = '■ 停止';
}

/* ================= 語音：聽 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let listenLang = 'zh-TW', listening = false, rec = null, finalText = '';
const micBtn = $('#mic'), hear = $('#hear');
var CH = {on: false};   // 接龍遊戲的狀態（放在這裡，語音功能一開始就能用）
function setHear(t, hint){ hear.textContent = t; hear.classList.toggle('hint', !!hint); const ch = document.getElementById('chHeard'); if (ch && CH.on) ch.textContent = t; }
// 語音結果交給誰：平常是查字典；玩接龍時交給遊戲
let voiceHook = null;
function routeVoice(t){ if (voiceHook) voiceHook(t); else handleInput(t, {voice:true}); }
function setMicUI(on){ micBtn.classList.toggle('listening', on); document.querySelectorAll('.ch-mic').forEach(b => b.classList.toggle('listening', on)); }
$('#langZh').onclick = () => setLang('zh-TW');
$('#langEn').onclick = () => setLang('en-US');
function setLang(l){ listenLang = l; $('#langZh').classList.toggle('on', l === 'zh-TW'); $('#langEn').classList.toggle('on', l !== 'zh-TW');
  setHear(l === 'zh-TW' ? '按住麥克風，說「幫我查○○」，說完放開' : '按住麥克風，用英文說，說完放開', true); }
const SR_MSG = {'not-allowed':'請允許使用麥克風才能用說的喔','no-speech':'沒有聽到聲音，再按一次麥克風試試看','network':'網路不穩，請再試一次','unavailable':'這台平板沒有語音辨識，請用打字或拍照'};
// Android 原生語音辨識的回呼
window.__sr = (type, text) => {
  if (G.nativeListen){ gameNativeSr(type, text); return; }   // 遊戲中的語音交給遊戲處理
  if (type === 'rms' || (type === 'final' && !listening)) return;   // 遊戲剛結束時晚到的結果，不要拿來查字
  if (type === 'start'){ listening = true; setMicUI(true); setHear(listenLang === 'zh-TW' ? '我在聽，請說…' : "I'm listening…", true); }
  else if (type === 'partial'){ if (text){ lastPartial = text; setHear('「' + text + '」'); } }
  else if (type === 'final'){ finalText = text; setHear('「' + text + '」'); }
  else if (type === 'error'){ if (text !== 'aborted') setHear(SR_MSG[text] || '沒聽清楚，再說一次好嗎？', true); }
  else if (type === 'end'){
    clearRecTimers(); listening = false; setMicUI(false);
    // 放開麥克風時，瀏覽器有時只給「還沒確定」的結果：也拿來查
    const t = finalText || lastPartial; finalText = ''; lastPartial = '';
    if (t) routeVoice(t);
  }
};
/* 網頁版語音辨識的保護：平板的 Chrome 在 app 剛念完結果後，偶爾會「開始了卻不會結束」，
   麥克風就一直紅著、按了也沒反應。所以每一段都設時間上限，時間到沒收到結束訊號就強制收掉、恢復成可以再按。 */
let lastPartial = '', recWatch = 0, stopWatch = 0, startWatch = 0;
function clearRecTimers(){ clearTimeout(recWatch); clearTimeout(stopWatch); clearTimeout(startWatch); }
function killRec(r){ if (!r) return; r.onstart = r.onresult = r.onerror = r.onend = null; try { r.abort(); } catch(e){} }
function resetMic(msg){
  clearRecTimers(); listening = false; setMicUI(false);
  if (msg) setHear(msg, true);
}
function forceEnd(r){
  if (r !== rec) return;
  killRec(r); rec = null;
  const t = finalText || lastPartial; finalText = ''; lastPartial = '';
  resetMic(t ? '' : '沒聽清楚，再按一次麥克風說說看');
  if (t) routeVoice(t);
}
function stopListen(){
  if (!listening) return;
  if (NATIVE){ window.Android.stopListen(); return; }
  const r = rec;
  if (!r){ resetMic(listenLang === 'zh-TW' ? '按住麥克風，說「幫我查○○」，說完放開' : '按住麥克風，用英文說，說完放開'); return; }
  r.__stopping = true;
  try { r.stop(); } catch(e){}
  clearTimeout(stopWatch);
  stopWatch = setTimeout(() => forceEnd(r), 1500);   // 停止後 1.5 秒還沒結束，就強制結束
}
function startListen(){
  if (listening) return;
  finalText = ''; lastPartial = '';
  if (NATIVE){ stopSpeak(); window.Android.listen(listenLang); return; }
  if (!SR){ setHear(SR_MSG.unavailable, true); return; }
  // 先把舊的辨識完全收掉
  killRec(rec); rec = null;
  listening = true; setMicUI(true);
  setHear(listenLang === 'zh-TW' ? '準備中…' : 'Getting ready…', true);
  // app 正在念東西時，先停掉並等一下，讓麥克風拿得到聲音
  const wasSpeaking = !!(window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending));
  stopSpeak();
  setTimeout(() => {
    if (!listening || rec) return;      // 等待中被取消了
    const r = new SR(); rec = r;
    r.lang = listenLang; r.interimResults = true; r.continuous = false;
    r.onstart = () => {
      if (rec !== r) return;
      r.__started = true;
      clearTimeout(startWatch);
      window.__sr('start');
      if (r.__stopping) return;          // 開始前就被按停了：交給停止的計時器處理
      clearTimeout(recWatch);
      recWatch = setTimeout(() => { if (rec === r) stopListen(); }, 12000);   // 一次最多聽 12 秒
    };
    r.onresult = e => { if (rec !== r) return; let t = ''; let fin = false; for (const x of e.results){ t += x[0].transcript; if (x.isFinal) fin = true; } window.__sr(fin ? 'final' : 'partial', t); };
    r.onerror = e => { if (rec === r) window.__sr('error', e.error); };
    r.onend = () => { if (rec !== r) return; rec = null; window.__sr('end'); };
    try { r.start(); }
    catch(e){ killRec(r); rec = null; resetMic('麥克風啟動失敗，請再按一次'); return; }
    // 3 秒內都沒開始，就當作卡住
    clearTimeout(startWatch);

  }, wasSpeaking ? 350 : 0);
}

/* ================= 判斷要查什麼 ================= */
function stripAsk(s){
  s = s.replace(/^(你好|哈囉|嗨|請問|請你|請|麻煩你?)+/, '');
  s = s.replace(/^(可以)?(幫我|幫忙|替我|我想要|我想|我要)?(查一下|查查看|查詢|查查|搜尋|找一下|找找|查|找|看看|看一下)+/, '');
  s = s.replace(/^(一下|這個|那個|一個)/, '');
  // 本身就是字典裡的詞（例如「單字」「名字」「文字」「歌詞」），就不要再刪字尾
  const isWord = t => !!t && !!((DICT && DICT[t]) || (IDIOMS && IDIOMS[t]));
  if (isWord(s)) return s;
  // 先去掉問句的尾巴：怎麼寫、什麼意思、呢、嗎……
  const tail = s.replace(/(怎麼寫|怎麼唸|怎麼念|怎麼拼|是什麼意思|什麼意思|的意思|意思)?(呢|嗎|啊|喔|好嗎|好不好|謝謝)*$/, '');
  if (isWord(tail)) return tail;
  // 再去掉「這個字」「這個詞」之類的說明；去掉後要還有字，而且不是把一個詞切壞
  const core = tail.replace(/(這個|那個|的)?(國字|生字|字|詞語|語詞|詞|成語|單字|句子)$/, '');
  if (core && (isWord(core) || !isWord(tail))) return core;
  return tail || s;
}
function parseInput(raw){
  let s = raw.trim();
  if (listenLang !== 'zh-TW' && !/[一-鿿]/.test(s)) return {type:'en', q:s};
  const compact = s.replace(/[，。！？、,!?「」『』"：:]/g, ' ').replace(/\s+/g, ' ').trim();
  // 中翻英：「蘋果的英文」「蘋果英文怎麼說」「英文的蘋果」「翻譯成英文 我很開心」
  let m = compact.replace(/\s/g, '').match(/^(?:請|幫我|我想知道|我要)*(?:查)?(.+?)的?(?:英文|英語)(?:是什麼|怎麼說|怎麼講|要怎麼說)?(?:呢|嗎)?$/) ||
          compact.replace(/\s/g, '').match(/^(?:請|幫我)*(?:翻譯成英文|翻成英文|英文的|用英文說|英語的)(.+)$/);
  if (m && /[一-鿿]/.test(m[1])) return {type:'zh2en', q: stripAsk(m[1]) || m[1]};
  // 英文：有英文字母 → 抓出英文部分
  if (hasLatin(compact)){
    let en = compact.replace(/[一-鿿ㄅ-ㄩˊˇˋ˙]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (/^([A-Za-z]\s)+[A-Za-z]$/.test(en)) en = en.replace(/\s/g, '');   // A P P L E → APPLE
    return {type: /翻譯|翻成|中文/.test(compact) || en.split(' ').length > 2 ? 'en' : 'en', q: en};
  }
  // 中文句子翻譯：「翻譯 我今天很開心」
  m = compact.replace(/\s/g, '').match(/^(?:請|幫我)*(?:翻譯|翻成)(.+)$/);
  if (m) return {type:'zh2en', q:m[1]};
  // 一般中文
  let t = stripAsk(compact.replace(/\s/g, ''));
  const mm = t.match(/^(.+?)的(.)$/);           // 喝水的水
  if (mm && mm[1].includes(mm[2])) return {type:'zh', q:mm[2], ctx:mm[1]};
  return {type:'zh', q: chars(t).filter(isHan).join('')};
}
async function handleInput(raw, opts = {}){
  const p = parseInput(raw);
  if (!p.q){ setHear('沒聽到要查的字，再說一次「幫我查○○」', true); if (opts.voice) speak('我沒有聽清楚，可以再說一次嗎？'); return; }
  if (p.type === 'en') return searchEnglish(p.q, opts);
  if (p.type === 'zh2en') return searchZh2En(p.q, opts);
  return search(p.q, {...opts, ctx:p.ctx});
}

async function search(q, opts = {}){
  stopSpeak(); closeSheet(); leaveGame();
  q = q.trim(); if (!q) return;
  main.innerHTML = '<div class="loading">正在翻字典…</div>';
  await dictReady;
  let e = entry(q);
  if (!e){
    await idiomsReady;
    if (IDIOMS[q]) e = [{zy: IDIOMS[q][0].split(/\s*（/)[0], rad:'', strokes:'', def: IDIOMS[q][1], variant:'', src:'成語典'}];
  }
  if (!e) return renderNotFound(q, opts);
  const cs = chars(q);
  cur = {q, e, chars: cs, idiom: false};
  if (cs.length >= 3){ await idiomsReady; if (IDIOMS[q]) cur.idiom = IDIOMS[q]; }

}

function zhuyinHTML(b){
  if (!b) return '';
  let light = '', tone = '', body = b.trim();
  if (body.startsWith('˙')){ light = '˙'; body = body.slice(1); }
  const tm = body.match(/[ˊˇˋ]$/); if (tm){ tone = tm[0]; body = body.slice(0, -1); }
  return `<span class="zy">${light ? '<span class="light">˙</span>' : ''}${chars(body).map(c => `<span>${c}</span>`).join('')}${tone ? `<span class="tone">${tone}</span>` : ''}</span>`;
}
const splitZy = zy => (zy || '').replace(/（.*$/, '').trim().split(/[\s　]+/).filter(Boolean);
function tilesHTML(cs, zy, sel){
  const z = splitZy(zy), ok = z.length === cs.length;
  return cs.map((c, i) => `<button class="tile ${i === sel ? 'on' : ''}" data-i="${i}"><span class="hz">${esc(c)}</span>${ok ? zhuyinHTML(z[i]) : ''}</button>`).join('');
}

  });

/* ================= 筆順：慢速動畫 + 一筆一筆 ================= */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
async function setupStrokes(ch){
  playToken++; step = 0; charData = null; writer = null;
  const el = $('#writer'); el.innerHTML = '';
  $('#stepview').setAttribute('hidden',''); $('#badge').hidden = true;
  if (!window.HanziWriter){ el.innerHTML = `<div class="fallback">${esc(ch)}</div>`; return; }
  const size = el.clientWidth || 300;
  try {
    charData = await HanziWriter.loadCharacterData(ch);
  } catch(err){ charData = null; }
  if (!charData){
    el.innerHTML = `<div class="fallback">${esc(ch)}</div>`;
    $('#stageNote').textContent = navigator.onLine === false ? '連上網路才能看筆順動畫' : '這個字暫時沒有筆順動畫';
    ['playStroke','prevStroke','nextStroke','quizStroke'].forEach(id => $('#' + id).disabled = true);
    return;
  }
  writer = HanziWriter.create(el, ch, {
    width: size, height: size, padding: size * 0.06,
    strokeColor: cssVar('--ink'), radicalColor: cssVar('--red'), outlineColor: cssVar('--grid-soft'),
    highlightColor: cssVar('--sun'), drawingColor: cssVar('--ink'), drawingWidth: 26,
    strokeAnimationSpeed: 0.35,          // 比一般慢很多
    delayBetweenStrokes: 900, showCharacter: true,
    charDataLoader: (c, done) => done(charData)
  });
  const n = charData.strokes.length;
  $('#stageNote').textContent = `共 ${n} 畫，紅色的部分是部首`;
  drawStrip();
}
// 筆順表：每一格多畫一筆，新的一筆是紅色
function strokeSVG(k, {big = false} = {}){
  const s = charData.strokes, rad = new Set(charData.radStrokes || []);
  let out = `<g transform="translate(0,900) scale(1,-1)">`;
  if (big) s.forEach(p => out += `<path d="${p}" fill="${cssVar('--grid-soft')}"/>`);
  for (let i = 0; i < k; i++){
    const color = i === k - 1 ? cssVar('--red') : (big && rad.has(i) ? cssVar('--ink-soft') : cssVar('--ink'));
    out += `<path d="${s[i]}" fill="${color}"/>`;
  }
  if (big && k > 0){   // 起筆點與方向箭頭
    const m = charData.medians[k - 1];
    const pts = m.map(p => p.join(',')).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="${cssVar('--sun')}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 34" opacity=".95"/>`;
    out += `<circle cx="${m[0][0]}" cy="${m[0][1]}" r="34" fill="${cssVar('--sun')}" stroke="${cssVar('--ink')}" stroke-width="6"/>`;
    const a = m[m.length - 2] || m[0], b = m[m.length - 1];
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const L = 46, w = 0.5;
    out += `<polygon points="${b[0]},${b[1]} ${b[0] - L * Math.cos(ang - w)},${b[1] - L * Math.sin(ang - w)} ${b[0] - L * Math.cos(ang + w)},${b[1] - L * Math.sin(ang + w)}" fill="${cssVar('--sun')}" stroke="${cssVar('--ink')}" stroke-width="5"/>`;
  }
  return out + '</g>';
}
function drawStrip(){
  const n = charData.strokes.length, box = $('#strip');
  box.innerHTML = Array.from({length: n}, (_, i) => `<button data-k="${i + 1}" class="${i + 1 === step ? 'on' : ''}" aria-label="第${i + 1}筆"><svg viewBox="0 0 1024 1024">${strokeSVG(i + 1)}</svg><i>${i + 1}</i></button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => gotoStep(+b.dataset.k));
}
function gotoStep(k){
  if (!charData) return;
  playToken++;
  const n = charData.strokes.length;
  k = Math.max(1, Math.min(n, k)); step = k;
  writer && writer.cancelQuiz && writer.cancelQuiz();
  $('#writer').style.visibility = 'hidden';
  const sv = $('#stepview'); sv.removeAttribute('hidden'); sv.innerHTML = strokeSVG(k, {big: true});
  $('#badge').hidden = false; $('#badge').textContent = `第 ${k} 筆 / 共 ${n} 筆`;
  $('#stageNote').textContent = '黃色圓點是起筆，箭頭是寫的方向';
  $('#strip').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
  $('#prevStroke').disabled = k <= 1; $('#nextStroke').disabled = k >= n;
}
async function playSlow(){
  if (!writer) return;
  const token = ++playToken;
  $('#stepview').setAttribute('hidden',''); $('#writer').style.visibility = '';
  writer.cancelQuiz && writer.cancelQuiz();
  const n = charData.strokes.length;
  await writer.hideCharacter();
  for (let i = 0; i < n; i++){
    if (token !== playToken) return;
    step = i + 1;
    $('#badge').hidden = false; $('#badge').textContent = `第 ${i + 1} 筆 / 共 ${n} 筆`;
    $('#strip').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.k === i + 1));
    $('#stageNote').textContent = `第 ${i + 1} 筆`;
    await new Promise(r => writer.animateStroke(i, {onComplete: r}));
    await sleep(1100);                       // 每一筆之間停久一點
  }
  if (token === playToken) $('#stageNote').textContent = '寫完了！可以按「上一筆」「下一筆」一筆一筆看';
}
function quizStroke(){
  if (!writer) return;
  playToken++;
  $('#stepview').setAttribute('hidden',''); $('#writer').style.visibility = ''; $('#badge').hidden = true;
  $('#stageNote').textContent = '用手指在格子裡照著筆順寫寫看！';
  writer.quiz({
    onMistake: () => { $('#stageNote').textContent = '不對喔，看黃色提示再試一次'; },
    onCorrectStroke: s => { $('#stageNote').textContent = `答對了！還有 ${s.strokesRemaining} 筆`; },
    onComplete: s => { const t = s.totalMistakes === 0 ? '太棒了，全部寫對！' : '寫完了，你好厲害！'; $('#stageNote').textContent = t; speak(t); }
  });
}

async function getJSON(url){ try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch(e){ return null; } }
async function translate(text, pair){
  const j = await getJSON('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair);
  let t = j && j.responseData && j.responseData.translatedText;
  if (!t || /MYMEMORY WARNING|QUERY LENGTH/i.test(t)) return null;
  return t;
}
const POS = {noun:'名詞', verb:'動詞', adjective:'形容詞', adverb:'副詞', pronoun:'代名詞', preposition:'介系詞', conjunction:'連接詞', interjection:'感嘆詞', exclamation:'感嘆詞', determiner:'限定詞', article:'冠詞', numeral:'數詞'};
function ipaToKK(ipa){
  let s = (ipa || '').replace(/^[\/\[]|[\/\]]$/g, '');
  s = s.replace(/ɹ/g, 'r').replace(/ɡ/g, 'g').replace(/oʊ|əʊ/g, 'o').replace(/eɪ/g, 'e').replace(/ː/g, '').replace(/\./g, '')
       .replace(/ɐ/g, 'ʌ').replace(/ɒ/g, 'ɑ').replace(/ɜr|ɜ˞|ɝ/g, 'ɝ').replace(/ər|ə˞/g, 'ɚ').replace(/ɾ/g, 't').replace(/ʔ/g, '');
  return '[' + s + ']';
}
async function sentencesEN(word){
  const j = await getJSON('https://api.tatoeba.org/unstable/sentences?lang=eng&q=' + encodeURIComponent('=' + word) + '&trans:lang=cmn&sort=relevance&limit=12');
  const out = [];
  for (const s of (j && j.data) || []){
    const tr = (s.translations || []).flat ? (s.translations || []).flat() : s.translations || [];
    const zh = tr.find(t => t.script === 'Hant') || null;
    if (s.text.split(' ').length <= 12) out.push({en: s.text, zh: zh ? zh.text : ''});
  }
  out.sort((a, b) => (b.zh ? 1 : 0) - (a.zh ? 1 : 0) || a.en.length - b.en.length);
  return out.slice(0, 4);
}
async function searchEnglish(q, opts = {}){

    </section>
    <section class="panel">
      ${meanings.length ? `<div class="heading">解釋</div><ol class="defs en-defs">${meanings.map((m, i) => `<li><span class="pos">${esc(POS[m.partOfSpeech] || m.partOfSpeech)}</span>${zhDefs[i] ? `<span class="zh">${esc(zhDefs[i])}</span>` : ''}<span class="en-t">${esc(m.definitions[0].definition)}</span></li>`).join('')}</ol>` : ''}
      ${ex.length ? `<div class="heading">例句</div><div class="sentences">${ex.map(s => `<div class="sent"><div class="tx"><span class="en-t">${hlEn(s.en, word)}</span>${s.zh ? `<span class="zh">${esc(s.zh)}</span>` : ''}</div><button class="round" data-en="${esc(s.en)}">🔊</button></div>`).join('')}</div>` : ''}

  const play = rate => {

const hlEn = (s, w) => esc(s).replace(new RegExp('\\b(' + w.replace(/[^a-z]/gi, '') + '\\w*)', 'gi'), '<b style="color:var(--red)">$1</b>');

/* ================= 拍照查字（文字辨識） ================= */
let ocrWorker = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
let ocrPages = [], ocrAppend = false;     // 可以連續拍好幾頁，合成一整篇故事
$('#camBtn').onclick = () => { stopSpeak(); ocrAppend = false; $('#camInput').click(); };
const onPhoto = ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) runOCR(f); };
$('#camInput').onchange = onPhoto;
$('#picInput').onchange = onPhoto;
async function shrink(file){
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1800 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function runOCR(file){
  closeSheet(); stopSpeak(); leaveGame();
  if (!ocrAppend) ocrPages = [];
  ocrAppend = false;
  const url = URL.createObjectURL(file);
  main.innerHTML = `<section class="panel"><div class="photo-wrap"><img src="${url}" alt="拍的照片"><div>
    <div class="heading">正在看第 ${ocrPages.length + 1} 頁的字…</div><p id="ocrNote">第一次使用要下載辨識資料，請稍等。</p>
    <div class="progress"><div id="ocrBar"></div></div></div></div></section>`;
  try {
    await dictReady;
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    if (!ocrWorker){
      ocrWorker = await Tesseract.createWorker(['chi_tra', 'eng'], 1, {
        logger: m => { const b = $('#ocrBar'); if (b && m.progress != null) b.style.width = Math.round(m.progress * 100) + '%';
          const n = $('#ocrNote'); if (n && m.status) n.textContent = ({'loading language traineddata':'下載辨識資料中…','initializing api':'準備中…','recognizing text':'辨識文字中…'}[m.status] || '處理中…'); }
      });

    const {data} = await ocrWorker.recognize(canvas);
    ocrPages.push({url, text: cleanOCR(data.text || '')});
    renderOCR();
  } catch(err){
    main.querySelector('.photo-wrap > div').innerHTML = `<div class="heading">看不出來</div><p>${navigator.onLine === false ? '拍照查字需要連上網路。' : '請再拍一次，字要清楚、光線要亮。'}</p>`;
  }

/* 整理辨識出的文字：去掉中文字之間多餘的空白，把同一段的換行接起來 */
function cleanOCR(t){
  const P = '\\p{Script=Han}，。！？、「」『』：；（）—…';
  const paras = t.replace(/\r/g, '').split(/\n\s*\n/);
  return paras.map(p => {
    const lines = p.split('\n').map(l => l.trim()).filter(Boolean);
    let out = '';
    for (const l of lines) out += (out && /[A-Za-z0-9,.!?'"]$/.test(out) && /^[A-Za-z0-9"']/.test(l)) ? ' ' + l : l;
    return out.replace(new RegExp(`([${P}])\\s+(?=[${P}])`, 'gu'), '$1')
              .replace(/(\p{Script=Han})\s*,\s*(?=\p{Script=Han})/gu, '$1，').replace(/(\p{Script=Han})\?/gu, '$1？').replace(/(\p{Script=Han})!/gu, '$1！');
  }).filter(Boolean).join('\n');
}
/* 把文章切成一句一句，並判斷每一句是中文還是英文 */
function storySentences(text){
  const out = [];
  for (const para of text.split('\n')){
    const ss = para.match(/[^。！？!?；;.\n]+[。！？!?；;.」』"]*/g) || [para];
    ss.forEach((s, i) => {
      const t = s.trim(); if (!t) return;
      const han = (t.match(/\p{Script=Han}/gu) || []).length, lat = (t.match(/[A-Za-z]/g) || []).length;
      out.push({t, lang: lat > han * 2 ? 'en-US' : 'zh-TW', br: i === 0 && out.length > 0});
    });
  }
  return out;
}
let storyList = [];
async function readStoryAll(btn, rate, from = 0){

    await sayOne(storyList[i].t, storyList[i].lang, storyList[i].lang.startsWith('en') ? rate : rate);
  }
  if (token === speakToken){ spans.forEach(x => x.classList.remove('cur')); btn.classList.remove('playing'); btn.innerHTML = btn.dataset.label; }
}

  }
  const n = ocrPages.length;
  main.innerHTML = `<div class="result">
    <section class="panel">

      ${storyList.length ? `<div class="tabs" style="gap:10px">

        <p class="story" id="ocrStory">${storyList.map((s, i) => `${s.br ? '<br>' : ''}<span data-s="${i}" ${s.lang.startsWith('en') ? 'style="font-family:var(--f-en)"' : ''}>${esc(s.t)}</span>`).join('')}</p>
        <p style="font-size:15px;color:var(--ink-soft);margin:8px 0 0">點任何一句，就從那一句開始念。故事有好幾頁？按「再拍下一頁」接著拍。</p>`
        : '<p>沒看到字，請靠近一點、拍清楚再試一次。</p>'}
      <div class="tabs" style="gap:10px;margin-top:14px">
        <button class="speak" id="ocrNext" style="background:var(--ink);color:var(--card)">📷 再拍下一頁</button>

function spawnInterval(){ const base = {easy:4.2, normal:3.6, hard:3.0}[G.diff]; return Math.max(1.0, base - 0.3 * (G.level - 1)); }
function fallSpeed(){ const base = {easy:0.26, normal:0.32, hard:0.4}[G.diff]; return G.cell * (base + 0.06 * (G.level - 1)); }
function spawnCol(){
  let cols = [...Array(COLS).keys()].filter(c => !G.blocks.some(b => !b.landed && b.col === c && b.y < G.cell * 1.6));
  if (!cols.length) return -1;
  cols.sort(() => Math.random() - 0.5);
  if (Math.random() < 0.55) cols.sort((a, b) => G.stacks[a].length - G.stacks[b].length);
  return cols[0];
}
function spawn(){
  if (G.mode === 'en'){
    const pool = G.enPool, onScreen = new Set(G.blocks.map(b => b.word));
    let q = null;
    for (let i = 0; i < 30; i++){ const c = pool[Math.floor(Math.random() * pool.length)]; if (!onScreen.has(c.w)){ q = c; break; } }
    const col = spawnCol();
    if (!q || col < 0) return;
    G.blocks.push({ch: q.w, word: q.w, emoji: q.e, zh: q.zh, col, y: -G.cell, landed:false, drop:false, dying:false});
    return;
  }
  const pool = POOLS[G.diff];
  const range = Math.min(pool.length, 60 + G.level * 30);
  const onScreen = new Set(G.blocks.map(b => b.ch));
  let ch = null;
  for (let i = 0; i < 30; i++){ const c = pool[Math.floor(Math.random() * range)].c; if (!onScreen.has(c)){ ch = c; break; } }
  if (!ch) return;
  let cols = [...Array(COLS).keys()].filter(c => !G.blocks.some(b => !b.landed && b.col === c && b.y < G.cell * 1.6));
  if (!cols.length) return;
  cols.sort(() => Math.random() - 0.5);
  if (Math.random() < 0.55) cols.sort((a, b) => G.stacks[a].length - G.stacks[b].length);
  const col = cols[0];
  const zy = entry(ch)[0].zy.replace(/（.*$/, '').trim();
  G.blocks.push({ch, zy, keys: readingKeys(ch), col, y: -G.cell, landed:false, drop:false, dying:false});

function loop(now){

function update(dt){
  G.t += dt;

  const lv = 1 + Math.max(Math.floor(G.hit / 8), Math.floor(G.t / 45));
  if (lv > G.level){ G.level = lv; G.levelFlash = G.t; sfx('level'); const el = $('#gLevel'); if (el) el.textContent = lv; }
  G.spawnT -= dt;
  if (G.spawnT <= 0){ spawn(); G.spawnT = spawnInterval(); }
  const v = fallSpeed();
  for (const b of G.blocks){
    if (b.landed || b.dying) continue;
    b.y += (b.drop ? G.cell * 7 : v) * dt;
    const floorY = (ROWS - 1 - G.stacks[b.col].length) * G.cell;
    if (b.y >= floorY){
      b.y = floorY; b.landed = true;
      G.stacks[b.col].push(b);
      if (!b.drop){ sfx('land'); G.landedChars.set(b.ch, (G.landedChars.get(b.ch) || 0) + 1); }
      b.drop = false;
      if (G.stacks[b.col].length >= ROWS){ gameOver(false); return; }
    }
  }
  for (const L of G.lasers) L.t += dt;
  G.lasers = G.lasers.filter(L => L.t < 0.35);
  for (const p of G.parts){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < p.life);
}
const BLOCK_TINT = ['--t-pink', '--t-yellow', '--t-green', '--t-purple', '--t-blue', '--t-orange'];
const BLOCK_EDGE = ['--pink', '--sun-deep', '--green', '--purple', '--blue', '--orange'];
function blockCenter(b){ return [b.col * G.cell + G.cell / 2, b.y + G.cell / 2]; }

/* 遊戲畫面：藍天（晚上是星空）、糖果字塊、會看著目標的小機器人砲台、彩虹雷射、星星爆炸、鼓勵字 */

function starPath(ctx, x, y, r, rot){

function gameDeco(){

  for (let i = 0; i < 28; i++) d.stars.push({x: Math.random(), y: Math.random() * 0.9, r: 1 + Math.random() * 2, p: Math.random() * 6});

function drawCloud(ctx, x, y, s){

  }

  const gy = boardH;
  ctx.fillStyle = dark ? '#2E6B5A' : '#7ED6A0'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = dark ? '#3D826E' : '#9BE3B6';
  for (let x = 0; x < W + 30; x += 30){ ctx.beginPath(); ctx.arc(x, gy + 2, 16, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = dark ? '#255A4B' : '#5FC488';
  for (let x = 12; x < W; x += 46){ ctx.beginPath(); ctx.moveTo(x, gy + 14); ctx.lineTo(x + 4, gy + 4); ctx.lineTo(x + 8, gy + 14); ctx.fill(); }
  // 小機器人砲台
  const cx = W / 2, cy = boardH + (H - boardH) * 0.58, R = cell * 0.4;
  const happy = t - (G.lastHitT || -9) < 0.5;
  const jump = happy ? -Math.sin((t - G.lastHitT) / 0.5 * Math.PI) * cell * 0.08 : 0;
  ctx.save(); ctx.translate(cx, cy + jump);
  // 砲管
  ctx.save(); ctx.rotate(G.aim + Math.PI / 2);
  ctx.fillStyle = C('--purple'); rr(ctx, -cell * 0.1, -R - cell * 0.42, cell * 0.2, cell * 0.46, cell * 0.08); ctx.fill();
  ctx.fillStyle = C('--sun'); rr(ctx, -cell * 0.13, -R - cell * 0.46, cell * 0.26, cell * 0.12, cell * 0.05); ctx.fill();
  ctx.restore();
  // 身體
  ctx.fillStyle = 'rgba(30,30,80,.18)'; ctx.beginPath(); ctx.ellipse(0, R * 1.05, R * 1.1, R * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  const body = ctx.createRadialGradient(-R * 0.3, -R * 0.4, R * 0.1, 0, 0, R * 1.2);
  body.addColorStop(0, '#FFF0A8'); body.addColorStop(1, C('--sun'));
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#2B2D5C'; ctx.stroke();
  // 天線
  ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, -R - cell * 0.12); ctx.stroke();
  ctx.fillStyle = happy ? C('--red') : C('--pink'); ctx.beginPath(); ctx.arc(0, -R - cell * 0.14, cell * 0.05, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  for (const sx of [-1, 1]){
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(sx * R * 0.36, -R * 0.12, R * 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2B2D5C'; ctx.beginPath(); ctx.arc(sx * R * 0.36 + ex, -R * 0.12 + ey, R * 0.13, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#FFB3CC'; ctx.beginPath(); ctx.arc(-R * 0.62, R * 0.25, R * 0.12, 0, Math.PI * 2); ctx.arc(R * 0.62, R * 0.25, R * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2B2D5C'; ctx.lineWidth = 2.5; ctx.beginPath();
  if (happy){ ctx.fillStyle = '#FF6B7A'; ctx.arc(0, R * 0.22, R * 0.24, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke(); }

  ctx.restore();
  // 彩虹雷射

    const a = 1 - L.t / 0.35;
    const lg = ctx.createLinearGradient(L.x1, L.y1, L.x2, L.y2);
    RAINBOW.forEach((n, i) => lg.addColorStop(i / 5, C(n)));
    ctx.lineCap = 'round'; ctx.globalAlpha = a;
    ctx.strokeStyle = lg; ctx.lineWidth = 18 * a + 4;
    ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.lineTo(L.x2, L.y2); ctx.stroke();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 6 * a + 1;
    ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.lineTo(L.x2, L.y2); ctx.stroke();
    ctx.strokeStyle = C('--sun'); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(L.x2, L.y2, cell * (0.3 + L.t * 2), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 星星、彩色碎片
  for (const p of G.parts){
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c;
    if (p.star){ starPath(ctx, p.x, p.y, p.s, p.t * 6); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s / 2, 0, Math.PI * 2); ctx.fill(); }
  }
